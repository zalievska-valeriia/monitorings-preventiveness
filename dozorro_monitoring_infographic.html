<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOZORRO — Розподіл моніторингів за типами методів закупівель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#e45266;
    --purple:#18063a;
    --violet:#7237c0;
    --green:#2db226;
    --orange:#fcad10;
    --yellow:#fcd700;
    --grey:#505050;
    --darkest:#0f0223;
    --lilac:#c9b3e8;
    --paper:#ffffff;
    --tint:#f7f4fb;
    --line:#e7e1ef;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--tint);font-family:'Roboto',Arial,sans-serif;}
  body{display:flex;justify-content:center;align-items:flex-start;padding:0;}

  .stage{
    container-type: inline-size;
    container-name: dz;
    width:100%;
    max-width:1920px;
    aspect-ratio:16/9;
    background:var(--paper);
    position:relative;
    overflow:visible;
    margin:0 auto;
  }

  /* ---------- fluid type/spacing via container query units, clamped for edge sizes ---------- */
  .frame{
    height:100%;
    display:flex; flex-direction:column;
    padding: clamp(14px, 2.6cqw, 56px) clamp(16px, 3.4cqw, 72px);
  }

  /* header */
  .header{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap: clamp(10px, 1.5cqw, 28px);
    flex: 0 0 auto;
  }
  .brandmark{ display:flex; align-items:center; gap: clamp(16px,2.2cqw,36px); flex:0 0 auto; }
  .brandmark img{ height: clamp(13px, 1.5cqw, 24px); width:auto; display:block; }

  .titleblock{ flex:1 1 auto; min-width:0; }
  .title{
    font-size:clamp(20px,3.1cqw,52px); font-weight:900; color:var(--purple);
    line-height:1.1; margin:0; letter-spacing:-0.01em;
  }

  /* filter */
  .filterbar, .metricbar{
    flex:0 0 auto; display:flex; align-items:center; gap:clamp(6px,0.8cqw,14px);
    margin-top: clamp(8px,1.3cqw,20px); flex-wrap:wrap;
  }
  .filter-label{
    font-size:clamp(9px,0.78cqw,13px); font-weight:700; color:var(--grey);
  }
  .segment-track{
    display:inline-flex; align-items:center; background:var(--tint);
    border-radius:999px; padding:clamp(2px,0.3cqw,4px); gap:2px; flex-wrap:wrap;
  }
  .filter-btn{
    appearance:none; border:none; background:transparent;
    color:var(--purple); font-family:inherit; font-weight:700; cursor:pointer;
    font-size:clamp(10px,0.95cqw,16px);
    padding:clamp(5px,0.65cqw,11px) clamp(10px,1.3cqw,22px);
    border-radius:999px; transition:background .2s ease, color .2s ease; white-space:nowrap;
  }
  .filter-btn:hover:not(.active){ background:rgba(24,6,58,.06); }
  .filter-btn.active{ background:var(--purple); color:#fff; }
  .metric-btn.active{ background:var(--pink); color:#fff; }

  /* main content */
  .main{
    flex:1 1 auto; display:flex; align-items:center; gap:clamp(10px,2.6cqw,50px);
    margin-top:clamp(6px,1.2cqw,18px); min-height:0;
  }

  .chartwrap{
    flex:0 0 auto; position:relative;
    container-type: inline-size; container-name: donut;
    width:clamp(160px,32cqw,420px); height:clamp(160px,32cqw,420px);
    display:flex; align-items:center; justify-content:center;
  }
  .chartwrap svg{ width:100%; height:100%; overflow:visible; }
  .donut-seg{
    transition: stroke-width .18s ease, filter .18s ease, opacity .18s ease;
    cursor:pointer;
  }
  .donut-seg.dim{ opacity:.28; }
  .donut-seg.hover{ filter: drop-shadow(0 0 0 rgba(0,0,0,0)); }

  .center-label{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; pointer-events:none;
  }
  .center-num{
    font-size:clamp(16px,11cqw,54px); font-weight:900; color:var(--purple); line-height:1;
  }
  .center-unit{
    font-size:clamp(8px,3.6cqw,15px); font-weight:700; color:var(--purple);
    margin-top:clamp(1px,0.6cqw,4px);
  }
  .center-cap{
    font-size:clamp(6.5px,3cqw,12px); font-weight:700; color:var(--grey);
    letter-spacing:.02em; margin-top:clamp(3px,1.4cqw,8px); max-width:56%;
  }

  .legend{
    flex:1 1 auto; display:flex; flex-direction:column; gap:clamp(6px,0.9cqw,14px);
    min-width:0;
  }
  .legend-row{
    display:flex; align-items:center; gap:clamp(8px,1cqw,16px);
    padding:clamp(6px,0.8cqw,13px) clamp(8px,1cqw,16px);
    border-radius:clamp(6px,0.7cqw,12px);
    border:1.5px solid transparent;
    cursor:pointer; transition:background .18s ease, border-color .18s ease, opacity .18s ease;
  }
  .legend-row:hover, .legend-row.active{ background:var(--tint); border-color:var(--line); }
  .legend-row.dim{ opacity:.4; }
  .dot{
    width:clamp(9px,1.05cqw,17px); height:clamp(9px,1.05cqw,17px); border-radius:50%;
    flex:0 0 auto;
  }
  .legend-text{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .legend-name{
    font-size:clamp(10px,1.02cqw,16.5px); font-weight:700; color:var(--purple);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .legend-sub{
    font-size:clamp(8.5px,0.8cqw,13px); color:var(--grey); font-weight:400;
  }
  .legend-val{ text-align:right; flex:0 0 auto; }
  .legend-count{
    font-size:clamp(11px,1.15cqw,19px); font-weight:900; color:var(--purple); line-height:1.1;
  }
  .legend-pct{
    font-size:clamp(8.5px,0.8cqw,13px); color:var(--grey); font-weight:700;
  }

  /* footer */
  .footer{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-top:clamp(8px,1.2cqw,18px);
    padding-top:clamp(6px,1cqw,16px);
    font-size:clamp(8px,0.7cqw,12px); color:var(--grey);
  }
  .footer b{ color:var(--purple); }
  .footer a{ color:inherit; text-decoration:none; }
  .footer a:hover b{ color:var(--pink); text-decoration:underline; }

  /* tooltip */
  .tooltip{
    position:absolute; z-index:20; pointer-events:none;
    background:var(--purple); color:#fff; padding:10px 14px; border-radius:10px;
    font-size:clamp(11px,0.95cqw,15px); line-height:1.35;
    max-width:min(260px, 82%);
    box-shadow:0 10px 24px rgba(15,2,35,.28);
    opacity:0; transform:translate(-50%,calc(-100% - 12px)) scale(.96);
    transition:opacity .12s ease, transform .12s ease;
  }
  .tooltip.show{ opacity:1; transform:translate(-50%,calc(-100% - 16px)) scale(1); }
  .tooltip .tt-num{ font-weight:900; font-size:1.2em; }
  .tooltip:after{
    content:""; position:absolute; left:50%; top:100%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:var(--purple);
  }
  .tooltip.flip{ transform:translate(-50%,12px) scale(.96); }
  .tooltip.flip.show{ transform:translate(-50%,16px) scale(1); }
  .tooltip.flip:after{
    top:auto; bottom:100%;
    border-top-color:transparent; border-bottom-color:var(--purple);
  }
  .tooltip.wide{ max-width:min(320px, 88%); }
  .tt-note{
    margin-top:6px; padding-top:6px; border-top:1px solid rgba(255,255,255,.22);
    font-size:0.86em; font-weight:400; line-height:1.4; color:rgba(255,255,255,.92);
  }
  .legend-flag{ color:var(--pink); font-weight:900; }

  /* ---------- MOBILE / narrow container layout ---------- */
  @container dz (max-width: 760px){
    .stage{ aspect-ratio:auto; }
    .frame{ height:auto; padding:18px 16px 16px; }
    .header{ align-items:flex-start; }
    .title{ font-size:19px; }
    .filterbar, .metricbar{ margin-top:10px; }
    .filter-btn{ font-size:11.5px; padding:6px 12px; }
    .main{ flex-direction:column; margin-top:14px; gap:16px; }
    .chartwrap{ width:min(62cqw,260px); height:min(62cqw,260px); }
    .legend{ width:100%; gap:8px; }
    .legend-row{ padding:9px 10px; }
    .legend-name{ font-size:12.5px; }
    .legend-count{ font-size:13.5px; }
    .footer{ font-size:10px; flex-wrap:wrap; row-gap:8px; }
    .brandmark{ gap:16px; }
    .brandmark img{ height:15px; }
  }
</style>
</head>

      'total':{tenders:592858, monitorings:2, tendersValue:405976856194.52, monitoredValue:770960.00}
    }
  }
];

/* Частки охоплення моніторингом (%, з таблиць даних) — показуються в підказці.
   count — частка промоніторених закупівель від оголошених;
   value — частка очікуваної вартості промоніторених закупівель від очікуваної вартості оголошених. */
const COVERAGE = {
  open:       { count:{'2024':3.13,'2025':3.31,'2026q1':3.12,'total':3.21}, value:{'2024':14.88,'2025':18.98,'2026q1':21.87,'total':17.63} },
  direct2024: { count:{'2024':0.05,'total':0.05},                             value:{'2024':5.68,'total':5.68} },
  below:      { count:{'2025':0.01,'2026q1':0.01,'total':0.01},              value:{'2025':0.65,'2026q1':1.40,'total':0.79} },
  above:      { count:{'2025':0.40,'2026q1':0.25,'total':0.36},              value:{'2025':5.36,'2026q1':2.87,'total':4.64} },
  simplified: { count:{'2024':0.83,'2025':0.97,'2026q1':1.27,'total':0.95}, value:{'2024':2.69,'2025':8.25,'2026q1':14.93,'total':6.67} },
  negotiated: { count:{'2024':8.65,'2025':0,'2026q1':0,'total':5.20},       value:{'2024':47.86,'2025':0,'2026q1':0,'total':17.19} },
  pricequote: { count:{'2024':'<0,01%','2025':'<0,01%','2026q1':0,'total':'<0,01%'},             value:{'2024':'<0,01%','2025':'<0,01%','2026q1':0,'total':'<0,01%'} }
};

const PERIODS = [
  {id:'2024', label:'2024'},
  {id:'2025', label:'2025'},
  {id:'2026q1', label:'I кв. 2026'},
  {id:'total', label:'Загалом'}
];

const METRICS = [
  {id:'count', label:'Кількість моніторингів'},
  {id:'value', label:'Очікувана вартість'}
];

let currentPeriod = 'total';
let currentMetric = 'count';
let activeCat = null;

/* ---------------- HELPERS ---------------- */
function fmt(n){ return n.toLocaleString('uk-UA'); }
function fmtPct(n){
  return (Math.round(n*100)/100).toLocaleString('uk-UA', {minimumFractionDigits: n>0 && n<0.1 ? 2 : (n%1===0?0:2), maximumFractionDigits:2});
}
function pct1(n){ return (Math.round(n*10)/10).toLocaleString('uk-UA', {maximumFractionDigits:1}); }

function fmtUAH(n){
  if(n===0) return '0 грн';
  if(n>=1e9) return (n/1e9).toLocaleString('uk-UA',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' млрд грн';
  if(n>=1e6) return (n/1e6).toLocaleString('uk-UA',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' млн грн';
  if(n>=1e3) return (n/1e3).toLocaleString('uk-UA',{maximumFractionDigits:1}) + ' тис. грн';
  return Math.round(n).toLocaleString('uk-UA') + ' грн';
}

/* splits a currency value into a number part and a unit part, so the
   center label can show them on two separate lines */
function splitUAH(n){
  if(n===0) return {num:'0', unit:'грн'};
  if(n>=1e9) return {num:(n/1e9).toLocaleString('uk-UA',{minimumFractionDigits:2, maximumFractionDigits:2}), unit:'млрд грн'};
  if(n>=1e6) return {num:(n/1e6).toLocaleString('uk-UA',{minimumFractionDigits:2, maximumFractionDigits:2}), unit:'млн грн'};
  if(n>=1e3) return {num:(n/1e3).toLocaleString('uk-UA',{maximumFractionDigits:1}), unit:'тис. грн'};
  return {num:Math.round(n).toLocaleString('uk-UA'), unit:'грн'};
}

/* value used for the donut / legend, depending on selected metric */
function metricVal(v){ return currentMetric==='count' ? v.monitorings : v.monitoredValue; }
function metricFmt(n){ return currentMetric==='count' ? fmt(n) : fmtUAH(n); }


/* ---------------- BUILD FILTER BUTTONS ---------------- */
const metricbar = document.getElementById('metricbar');
METRICS.forEach(m=>{
  const btn = document.createElement('button');
  btn.className = 'filter-btn metric-btn' + (m.id===currentMetric ? ' active' : '');
  btn.textContent = m.label;
  btn.dataset.metric = m.id;
  btn.addEventListener('click', ()=>{
    currentMetric = m.id;
    document.querySelectorAll('#metricbar .filter-btn').forEach(b=>b.classList.toggle('active', b.dataset.metric===m.id));
    render();
  });
  metricbar.appendChild(btn);
});

const filterbar = document.getElementById('filterbar');
PERIODS.forEach(p=>{
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (p.id===currentPeriod ? ' active' : '');
  btn.textContent = p.label;
  btn.dataset.period = p.id;
  btn.addEventListener('click', ()=>{
    currentPeriod = p.id;
    document.querySelectorAll('#filterbar .filter-btn').forEach(b=>b.classList.toggle('active', b.dataset.period===p.id));
    render();
  });
  filterbar.appendChild(btn);
});

/* ---------------- SVG DONUT ---------------- */
const R = 94;
const CIRC = 2*Math.PI*R;
const segGroup = document.getElementById('segments');
const legendEl = document.getElementById('legend');
const tooltip = document.getElementById('tooltip');
const stage = document.getElementById('stage');

function buildSegments(){
  segGroup.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',120); c.setAttribute('cy',120); c.setAttribute('r',R);
    c.setAttribute('fill','none');
    c.setAttribute('stroke', cat.hex);
    c.setAttribute('stroke-width', 30);
    c.setAttribute('class','donut-seg');
    c.dataset.id = cat.id;
    c.addEventListener('mouseenter', (e)=>onSegHover(cat, e));
    c.addEventListener('mousemove', (e)=>positionTooltip(e));
    c.addEventListener('mouseleave', onSegLeave);
    c.addEventListener('click', ()=>toggleActive(cat.id));
    segGroup.appendChild(c);
  });
}
buildSegments();

function render(){
  const total = CATEGORIES.reduce((s,c)=> s + metricVal(c.values[currentPeriod]), 0);
  const centerUnitEl = document.getElementById('centerUnit');
  if(currentMetric==='count'){
    document.getElementById('centerNum').textContent = fmt(total);
    centerUnitEl.textContent = '';
    centerUnitEl.style.display = 'none';
  } else {
    const {num, unit} = splitUAH(total);
    document.getElementById('centerNum').textContent = num;
    centerUnitEl.textContent = unit;
    centerUnitEl.style.display = 'block';
  }
  document.getElementById('centerCap').textContent =
    currentMetric==='count' ? 'моніторингів проведено' : 'очікувана вартість промоніторених закупівель';

  let cursor = 0;
  const circles = segGroup.querySelectorAll('circle');
  CATEGORIES.forEach((cat,i)=>{
    const v = metricVal(cat.values[currentPeriod]);
    const frac = total>0 ? v/total : 0;
    const len = frac*CIRC;
    const c = circles[i];
    c.setAttribute('stroke-dasharray', `${len} ${CIRC-len}`);
    c.setAttribute('stroke-dashoffset', -cursor);
    cursor += len;
    c.dataset.frac = frac;
  });

  buildLegend(total);
  applyActiveState();
}

function buildLegend(total){
  legendEl.innerHTML = '';
  const shareCap = currentMetric==='count' ? 'усіх моніторингів' : 'усієї вартості промоніторених закупівель';
  const unitCap = currentMetric==='count' ? 'моніторингів' : 'очікувана вартість';
  CATEGORIES.forEach(cat=>{
    if(cat.hiddenPeriods && cat.hiddenPeriods.includes(currentPeriod)) return;
    const v = cat.values[currentPeriod];
    const val = metricVal(v);
    const share = total>0 ? (val/total*100) : 0;
    const noteHtml = cat.totalNote && currentPeriod==='total'
      ? ` · ${cat.totalNote}` : '';
    const flagHtml = cat.disclaimer
      ? ' <span class="legend-flag">*</span>' : '';
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.dataset.id = cat.id;
    row.innerHTML = `
      <span class="dot" style="background:${cat.hex}"></span>
      <span class="legend-text">
        <span class="legend-name">${cat.name}${flagHtml}</span>
        <span class="legend-sub">${share.toLocaleString('uk-UA',{minimumFractionDigits:2, maximumFractionDigits:2})}% ${shareCap}${noteHtml}</span>
      </span>
      <span class="legend-val">
        <div class="legend-count">${metricFmt(val)}</div>
        <div class="legend-pct">${unitCap}</div>
      </span>
    `;
    row.addEventListener('mouseenter', (e)=>{ onSegHover(cat, e, row); });
    row.addEventListener('mousemove', (e)=>positionTooltip(e));
    row.addEventListener('mouseleave', onSegLeave);
    row.addEventListener('click', ()=>toggleActive(cat.id));
    legendEl.appendChild(row);
  });
}

function toggleActive(id){
  activeCat = (activeCat===id) ? null : id;
  applyActiveState();
}

function applyActiveState(){
  const circles = segGroup.querySelectorAll('circle');
  const rows = legendEl.querySelectorAll('.legend-row');
  circles.forEach(c=>{
    const isActive = !activeCat || c.dataset.id===activeCat;
    c.classList.toggle('dim', !isActive);
    c.setAttribute('stroke-width', (!activeCat ? 30 : (c.dataset.id===activeCat ? 34 : 30)));
  });
  rows.forEach(r=>{
    const isActive = !activeCat || r.dataset.id===activeCat;
    r.classList.toggle('dim', !isActive);
    r.classList.toggle('active', r.dataset.id===activeCat);
  });
}

function onSegHover(cat, evt, rowEl){
  const v = cat.values[currentPeriod];
  let coverage, valStr, coverPhrase;

  if(currentMetric==='count'){
    coverage = v.tenders>0 ? (v.monitorings/v.tenders*100) : 0;
    valStr = fmt(v.monitorings);
    coverPhrase = `від оголошених ${cat.genitive}`;
  } else {
    coverage = v.tendersValue>0 ? (v.monitoredValue/v.tendersValue*100) : 0;
    valStr = fmtUAH(v.monitoredValue);
    coverPhrase = `від очікуваної вартості оголошених ${cat.genitive}`;
  }
  const tableCov = COVERAGE[cat.id] && COVERAGE[cat.id][currentMetric] && COVERAGE[cat.id][currentMetric][currentPeriod];
  if (typeof tableCov === 'number') coverage = tableCov;
  // рядок (наприклад, «<0,01%») показується як є
  const covStr = (typeof tableCov === 'string') ? tableCov
    : coverage.toLocaleString('uk-UA',{minimumFractionDigits:2, maximumFractionDigits:2}) + '%';

  let html = `<span class="tt-num">${valStr}</span> — ${covStr} ${coverPhrase}`;
  if(cat.disclaimer){
    html += `<div class="tt-note">${cat.disclaimer}</div>`;
  } else if(cat.totalNote && currentPeriod==='total'){
    html += `<div class="tt-note">Дані ${cat.totalNote}; 2024 рік показано окремим рядком «Прямі закупівлі (2024)».</div>`;
  }
  if(cat.extraNote){
    html += `<div class="tt-note">${cat.extraNote}</div>`;
  }
  tooltip.innerHTML = html;
  tooltip.classList.toggle('wide', !!(cat.disclaimer || cat.extraNote || (cat.totalNote && currentPeriod==='total')));
  tooltip.classList.add('show');
  positionTooltip(evt);

  const circles = segGroup.querySelectorAll('circle');
  circles.forEach(c=>{
    c.classList.toggle('dim', c.dataset.id!==cat.id);
  });
  legendEl.querySelectorAll('.legend-row').forEach(r=>{
    r.classList.toggle('dim', r.dataset.id!==cat.id);
  });
}

function onSegLeave(){
  tooltip.classList.remove('show');
  applyActiveState();
}

function positionTooltip(evt){
  const stageRect = stage.getBoundingClientRect();
  let x = evt.clientX - stageRect.left;
  let y = evt.clientY - stageRect.top;

  const margin = 8;
  const ttW = tooltip.offsetWidth || 200;
  const ttH = tooltip.offsetHeight || 40;
  const halfW = ttW / 2;

  // keep tooltip horizontally within the stage
  x = Math.min(Math.max(x, halfW + margin), stageRect.width - halfW - margin);

  // flip below the point if there isn't enough room above
  const flip = (y - ttH - 16) < margin;
  tooltip.classList.toggle('flip', flip);

  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

/* touch support: tap segment/legend shows tooltip briefly */
segGroup.addEventListener('touchstart', (e)=>{
  const target = e.target.closest('.donut-seg');
  if(!target) return;
  const cat = CATEGORIES.find(c=>c.id===target.dataset.id);
  const touch = e.touches[0];
  onSegHover(cat, {clientX:touch.clientX, clientY:touch.clientY});
  setTimeout(()=>{ tooltip.classList.remove('show'); applyActiveState(); }, 2200);
}, {passive:true});

render();
</script>
