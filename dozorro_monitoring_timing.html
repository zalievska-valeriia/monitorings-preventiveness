<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Часові рамки проведення моніторингів — DOZORRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#fff;}
  .outer{
    container-type:inline-size;
    container-name:outerstage;
    width:100%;
    max-width:1920px;
    margin:0 auto;
  }
  .stage{
    font-family:'Roboto',Arial,sans-serif;
    color:#505050;
    background:#ffffff;
    width:100%;
    aspect-ratio:16/9;
    display:flex;
    flex-direction:column;
    padding:3.4cqw 3.6cqw 2.6cqw;
    overflow:hidden;
    --pink:#e45266;
    --purple:#18063a;
    --green:#2db226;
    --violet:#7237c0;
    --orange:#fcad10;
    --yellow:#fcd700;
    --grey:#505050;
    --tint:#f0edf7;
  }
  @container outerstage (max-width:760px){
    .stage{aspect-ratio:unset;height:auto;padding:6.5cqw 6cqw 5cqw;}
  }

  /* header */
  .header{flex:0 0 auto;}
  .title{
    margin:0;
    font-weight:900;
    font-size:2.6cqw;
    line-height:1.12;
    color:var(--purple);
    letter-spacing:-0.01em;
  }
  @container outerstage (max-width:760px){
    .title{font-size:7.2cqw;}
  }

  /* filters */
  .filters{
    display:flex;
    gap:2.2cqw;
    margin-top:1.6cqw;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  .filter-group{display:flex;flex-direction:column;gap:0.55cqw;}
  .filter-label{
    font-size:0.95cqw;
    font-weight:500;
    color:var(--grey);
  }
  .segmented{
    display:inline-flex;
    background:var(--tint);
    border-radius:999px;
    padding:0.35cqw;
    gap:0.2cqw;
    width:fit-content;
  }
  .segmented button{
    appearance:none;
    border:none;
    background:transparent;
    cursor:pointer;
    font-family:inherit;
    font-size:1cqw;
    font-weight:500;
    color:var(--purple);
    padding:0.65cqw 1.6cqw;
    border-radius:999px;
    transition:background .18s ease,color .18s ease;
    white-space:nowrap;
  }
  .segmented button.active{
    background:var(--purple);
    color:#fff;
    font-weight:700;
  }
  @container outerstage (max-width:760px){
    .filter-label{font-size:3.2cqw;}
    .segmented button{font-size:3.3cqw;padding:2.2cqw 4cqw;}
    .segmented{padding:1.1cqw;}
  }

  /* main */
  .main{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    gap:3.2cqw;
    margin-top:1.6cqw;
    min-height:0;
  }
  .chart-col{
    flex:0 0 42%;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
  }
  .chartwrap{
    container-type:inline-size;
    container-name:chartbox;
    position:relative;
    width:100%;
    max-width:32cqw;
    aspect-ratio:1/1;
  }
  .chartwrap svg{width:100%;height:100%;display:block;overflow:visible;}
  .chartwrap circle{
    transition:stroke-width .18s ease, opacity .18s ease;
    cursor:pointer;
  }
  .center-label{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    max-width:57%;
    pointer-events:none;
  }
  .center-value{
    font-weight:900;
    font-size:13.5cqw;
    line-height:1;
    color:var(--purple);
  }
  .center-unit{
    font-weight:700;
    font-size:4.6cqw;
    color:var(--purple);
    margin-top:0.4cqw;
  }
  .center-caption{
    font-size:3cqw;
    color:var(--grey);
    margin-top:0.9cqw;
    line-height:1.25;
  }

  .legend-col{
    flex:1 1 auto;
    min-width:0;
    max-height:100%;
    overflow:auto;
  }
  .legend-hint{
    font-size:0.82cqw;
    color:var(--grey);
    margin:0 0 0.7cqw 0.2cqw;
  }
  .legend{
    list-style:none;
    margin:0;padding:0;
    display:flex;
    flex-direction:column;
    gap:0.22cqw;
  }
  .legend-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1cqw;
    padding:0.4cqw 0.8cqw;
    border-radius:0.5cqw;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
  }
  .legend-item:hover,.legend-item.active{background:var(--tint);}
  .legend-item.dim{opacity:0.38;}
  .legend-left{display:flex;align-items:center;gap:0.7cqw;min-width:0;}
  .legend-dot{
    width:0.95cqw;height:0.95cqw;min-width:9px;min-height:9px;
    border-radius:50%;
    flex:0 0 auto;
  }
  .legend-text{min-width:0;display:flex;align-items:baseline;gap:0.55cqw;flex-wrap:wrap;}
  .legend-name{
    font-size:0.98cqw;
    font-weight:500;
    color:var(--purple);
    line-height:1.3;
  }
  .legend-badge{
    display:inline-block;
    font-size:0.68cqw;
    font-weight:700;
    color:#fff;
    background:var(--green);
    border-radius:999px;
    padding:0.08cqw 0.65cqw;
    white-space:nowrap;
  }
  .legend-share{
    font-size:0.85cqw;
    color:var(--grey);
    white-space:nowrap;
  }
  .legend-right{
    text-align:right;
    flex:0 0 auto;
    font-weight:700;
    font-size:1.02cqw;
    color:var(--purple);
    white-space:nowrap;
  }
  @container outerstage (max-width:760px){
    .main{flex-direction:column;gap:6cqw;margin-top:5cqw;}
    .chart-col{flex:0 0 auto;width:100%;}
    .chartwrap{max-width:62cqw;}
    .center-value{font-size:12.5cqw;}
    .center-unit{font-size:4.2cqw;}
    .center-caption{font-size:2.9cqw;}
    .legend-col{width:100%;max-height:none;overflow:visible;}
    .legend{gap:2.6cqw;}
    .legend-item{padding:2.4cqw 2.6cqw;border-radius:2.2cqw;}
    .legend-dot{width:3.4cqw;height:3.4cqw;margin-top:0.9cqw;}
    .legend-name{font-size:3.6cqw;}
    .legend-badge{font-size:2.6cqw;padding:0.6cqw 2.4cqw;}
    .legend-share{font-size:3.2cqw;}
    .legend-right{font-size:3.8cqw;}
    .legend-hint{font-size:2.8cqw;margin-bottom:2.2cqw;}
  }

  /* tooltip */
  .tooltip{
    position:absolute;
    pointer-events:none;
    background:var(--purple);
    color:#fff;
    font-size:0.95cqw;
    line-height:1.35;
    padding:0.75cqw 1cqw;
    border-radius:0.55cqw;
    max-width:min(260px,32%);
    opacity:0;
    transform:translate(-50%,-100%);
    transition:opacity .12s ease;
    z-index:30;
    box-shadow:0 6px 18px rgba(24,6,58,.25);
  }
  .tooltip.visible{opacity:1;}
  .tooltip::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-6px;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:var(--purple);
  }
  .tooltip.flip::after{
    top:-6px;bottom:auto;
    border-top-color:transparent;
    border-bottom-color:var(--purple);
  }
  @container outerstage (max-width:760px){
    .tooltip{font-size:3cqw;padding:2.2cqw 2.8cqw;border-radius:1.6cqw;max-width:min(220px,70%);}
  }

  /* footer */
  .footer{
    flex:0 0 auto;
    margin-top:1.6cqw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1.6cqw;
    flex-wrap:wrap;
  }
  .source{
    font-size:0.85cqw;
    color:var(--grey);
    max-width:62%;
    line-height:1.4;
  }
  .source a{
    color:var(--grey);
    text-decoration:underline;
    text-decoration-color:rgba(80,80,80,.45);
    transition:color .15s ease;
  }
  .source a:hover{color:var(--pink);text-decoration-color:var(--pink);}
  .logos{
    display:flex;
    align-items:center;
    gap:1.6cqw;
    flex-wrap:wrap;
  }
  .logos img{display:block;height:2.1cqw;width:auto;}
  .logos img.dozorro{height:1.9cqw;}
  @container outerstage (max-width:760px){
    .footer{margin-top:5cqw;}
    .source{font-size:2.7cqw;max-width:100%;}
    .logos{gap:5cqw;margin-top:2.5cqw;}
    .logos img{height:6.2cqw;}
    .logos img.dozorro{height:5.6cqw;}
  }
</style>
</head>
<body>
<div class="outer">
  <div class="stage">

    <div class="header">
      <h1 class="title">Часові рамки проведення моніторингів</h1>

  function buildDonut(){
    svg.innerHTML = "";
    categories.forEach(function(c){
      var circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
      circle.setAttribute("cx", CX);
      circle.setAttribute("cy", CY);
      circle.setAttribute("r", R);
      circle.setAttribute("fill", "none");
      circle.setAttribute("stroke", c.color);
      circle.setAttribute("stroke-width", SW);
      circle.setAttribute("transform", "rotate(-90 "+CX+" "+CY+")");
      circle.dataset.id = c.id;
      svg.appendChild(circle);

      circle.addEventListener("mouseenter", function(e){ setActive(c.id); showTooltip(e, c); });
      circle.addEventListener("mousemove", function(e){ positionTooltip(e); });
      circle.addEventListener("mouseleave", function(){ setActive(null); hideTooltip(); });
      circle.addEventListener("click", function(e){
        setActive(activeId === c.id ? null : c.id);
        showTooltip(e, c);
      });
    });
  }

  // Порядок: від більшого до меншого за обраний період;
  // «Інші часові рамки» і «Незавершені моніторинги» завжди в кінці
  var TAIL = ["c8","c9"];
  function orderedCats(p){
    var main = categories.filter(function(c){ return TAIL.indexOf(c.id) === -1; });
    main.sort(function(a,b){ return b.v[p] - a.v[p]; });
    var tail = TAIL.map(function(id){ return categories.filter(function(c){ return c.id === id; })[0]; });
    return main.concat(tail);
  }

  function render(){
    var total = periodTotals[currentPeriod];
    var offsetAcc = 0;

    orderedCats(currentPeriod).forEach(function(c){
      var value = c.v[currentPeriod];
      var frac = total > 0 ? value/total : 0;
      var len = frac * CIRC;
      var circle = svg.querySelector('circle[data-id="'+c.id+'"]');
      circle.setAttribute("stroke-dasharray", len + " " + (CIRC - len));
      circle.setAttribute("stroke-dashoffset", -offsetAcc);
      offsetAcc += len;

      var pct = total > 0 ? (value/total*100) : 0;
      var li = legendEl.querySelector('.legend-item[data-id="'+c.id+'"]');
      legendEl.appendChild(li);
      li.querySelector('[data-role="share"]').textContent = fmtPercent(pct) + "% від показника";
      li.querySelector('[data-role="value"]').textContent = fmtInt.format(value);
    });

    centerValue.textContent = fmtInt.format(total);
    centerCaption.textContent = periodMeta[currentPeriod].caption;
    applyActiveState();
  }

  function setActive(id){
    activeId = id;
    applyActiveState();
  }

  function applyActiveState(){
    categories.forEach(function(c){
      var circle = svg.querySelector('circle[data-id="'+c.id+'"]');
      var li = legendEl.querySelector('.legend-item[data-id="'+c.id+'"]');
      if(activeId === null){
        circle.setAttribute("stroke-width", SW);
        circle.style.opacity = 1;
        li.classList.remove("active","dim");
      } else if(c.id === activeId){
        circle.setAttribute("stroke-width", SW + 14);
        circle.style.opacity = 1;
        li.classList.add("active");
        li.classList.remove("dim");
      } else {
        circle.setAttribute("stroke-width", SW - 10);
        circle.style.opacity = 0.35;
        li.classList.add("dim");
        li.classList.remove("active");
      }
    });
  }

  function showTooltip(e, c){
    var total = periodTotals[currentPeriod];
    var value = c.v[currentPeriod];
    var pct = total > 0 ? (value/total*100) : 0;
    tooltip.innerHTML = fmtInt.format(value) + " — " + fmtPercent(pct) + "% моніторингів " + periodMeta[currentPeriod].caption.replace(/^за /,"за ");
    tooltip.classList.add("visible");
    positionTooltip(e);
  }

  function hideTooltip(){
    tooltip.classList.remove("visible");
  }

  function positionTooltip(e){
    var wrapRect = chartwrap.getBoundingClientRect();
    var tRect = tooltip.getBoundingClientRect();
    var x = e.clientX - wrapRect.left;
    var y = e.clientY - wrapRect.top;

    var minX = tRect.width/2 + 4;
    var maxX = wrapRect.width - tRect.width/2 - 4;
    var clampedX = Math.min(Math.max(x, minX), maxX);

    var flip = y - tRect.height - 10 < 0;
    tooltip.classList.toggle("flip", flip);

    tooltip.style.left = clampedX + "px";
    tooltip.style.top = flip ? (y + 14) + "px" : (y - 10) + "px";
  }

  var switchEl = document.getElementById("periodSwitch");
  switchEl.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if(!btn) return;
    switchEl.querySelectorAll("button").forEach(function(b){b.classList.remove("active");});
    btn.classList.add("active");
    currentPeriod = btn.dataset.value;
    render();
  });

  buildLegend();
  buildDonut();
  render();
})();
</script>
</body>
</html>
