<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Розподіл термінів початку моніторингу після оприлюднення договору</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');

  :root{
    --pink:#e45266;
    --dark-purple:#18063a;
    --purple:#7237c0;
    --orange:#fcad10;
    --yellow:#fcd700;
    --grey:#505050;
    --tint:#f1eef8;
    --line:#e5e1f0;
    --bg:#ffffff;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Roboto',Arial,sans-serif;
    background:var(--bg);
    color:var(--dark-purple);
  }

  .stage{
    container-type: inline-size;
    container-name: stage;
    width:100%;
    max-width:1920px;
    margin:0 auto;
    background:#ffffff;
    padding: 3.2cqw 3.2cqw 2.4cqw;
  }

  /* --- desktop: fixed 16:9 canvas --- */
  .canvas{
    display:flex;
    flex-direction:column;
    width:100%;
  }

  .head-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap: 1.6cqw;
    margin-bottom: 1.8cqw;
  }

  h1{
    font-family:'Roboto',Arial,sans-serif;
    font-weight:900;
    font-size: 2.55cqw;
    line-height:1.12;
    margin:0;
    color:var(--dark-purple);
    max-width: 62cqw;
  }

  .main-row{
    display:flex;
    flex-direction:column;
    gap:1.8cqw;
    margin-top:.6cqw;
  }

  .chart-col{
    width:100%;
    max-width:76cqw;
    margin:0 auto;
    order:2;
    container-type: inline-size;
    container-name: chartwrap;
  }

  .chart-frame{
    position:relative;
    width:100%;
  }

  .chart-frame svg{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
  }

  .legend-col{
    order:1;
    display:flex;
    flex-direction:row;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:.6cqw 1.8cqw;
    width:100%;
  }

  .legend-title{
    flex:1 1 100%;
    text-align:center;
    font-size:.95cqw;
    color:var(--grey);
    font-weight:500;
    margin-bottom:.2cqw;
  }

  .legend-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.8cqw;
    padding:.75cqw .9cqw;
    border-radius:12px;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
    background:transparent;
  }
  .legend-row:hover{
    background:var(--tint);
  }
  .legend-row.dim{
    opacity:.38;
  }
  .legend-left{
    display:flex;
    align-items:center;
    gap:.7cqw;
    min-width:0;
  }
  .legend-dot{
    width:.95cqw;
    height:.95cqw;
    min-width:10px;
    min-height:10px;
    border-radius:4px;
    flex-shrink:0;
  }
  .legend-name{
    font-size:1.02cqw;
    font-weight:700;
    color:var(--dark-purple);
    white-space:nowrap;
  }
  .legend-pct{
    font-size:.92cqw;
    color:var(--grey);
    font-weight:500;
  }
  .legend-value{
    font-size:1.05cqw;
    font-weight:900;
    color:var(--dark-purple);
    white-space:nowrap;
    text-align:right;
  }

  /* bars */
  .bar{
    cursor:pointer;
    transition: opacity .15s ease;
  }
  .bar.dim{ opacity:.35; }
  .period-label{
    font-family:'Roboto',Arial,sans-serif;
    font-weight:700;
    fill:var(--dark-purple);
    text-anchor:middle;
  }

  /* tooltip */
  .tooltip{
    position:absolute;
    pointer-events:none;
    background:var(--dark-purple);
    color:#fff;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    line-height:1.4;
    max-width:min(260px, 60%);
    opacity:0;
    transform:translate(-50%,-100%);
    transition:opacity .12s ease;
    z-index:20;
    box-shadow:0 8px 24px rgba(24,6,58,.28);
  }
  .tooltip b{ font-weight:900; }
  .tooltip::after{
    content:"";
    position:absolute;
    left:50%;
    top:100%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:var(--dark-purple);
  }
  .tooltip.flip{
    transform:translate(-50%,4px);
  }
  .tooltip.flip::after{
    top:auto;
    bottom:100%;
    border-top-color:transparent;
    border-bottom-color:var(--dark-purple);
  }
  .tooltip.show{ opacity:1; }

  /* footer */
  .footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:1cqw 1.6cqw;
    margin-top:2.2cqw;
  }
  .source{
    font-size:.82cqw;
    color:var(--grey);
    max-width:60cqw;
    line-height:1.45;
  }
  .source a{
    color:var(--grey);
    text-decoration:underline;
    text-decoration-color:rgba(80,80,80,.4);
    transition:color .15s ease;
  }
  .source a:hover{
    color:var(--pink);
  }
  .logos{
    display:flex;
    align-items:center;
    gap:1.6cqw;
    flex-shrink:0;
  }
  .logos img{
    height:1.9cqw;
    min-height:18px;
    width:auto;
    display:block;
  }

  /* ---------------- MOBILE ---------------- */
  @container stage (max-width: 760px){
    .stage{ padding: 6vw 5vw 5vw; }
    h1{ font-size: 6.4vw; max-width:100%; line-height:1.15; }
    .head-row{ margin-bottom:5vw; }

    .main-row{
      flex-direction:column;
      gap:6vw;
    }
    .chart-col{ order:1; }
    .legend-col{ order:2; flex-direction:column; flex-wrap:nowrap; align-items:stretch; justify-content:flex-start; width:100%; gap:2.4vw; }
    .legend-title{ flex:none; text-align:left; font-size:3.2vw; }
    .legend-row{ padding:2.6vw 3vw; }
    .legend-dot{ width:3.4vw; height:3.4vw; min-width:12px; min-height:12px; }
    .legend-name{ font-size:3.5vw; }
    .legend-pct{ font-size:3.2vw; }
    .legend-value{ font-size:3.6vw; }

    .footer{ flex-direction:column; align-items:flex-start; margin-top:6vw; gap:3vw; }
    .source{ font-size:3vw; max-width:100%; }
    .logos img{ height:6vw; min-height:20px; }
    .tooltip{ font-size:3.2vw; padding:2.2vw 3vw; max-width:min(220px,72%); }
  }

  @container chartwrap (max-width: 420px){
    .period-label{ font-size:33px !important; }
  }
</style>
</head>

  const PERIOD_ORDER = ["2024","2025","2026"];
  const CAT_ORDER = ["0-7","8-14","15-21","22+"];
  const CAT_COLOR = { "0-7":"#7237c0", "8-14":"#fcad10", "15-21":"#e45266", "22+":"#18063a" };
  const CAT_NAME  = { "0-7":"0–7 днів", "8-14":"8–14 днів", "15-21":"15–21 днів", "22+":"22 і більше днів" };

  const nfInt = new Intl.NumberFormat('uk-UA');
  const fmtPct = (v) => {
    let s = v.toFixed(2).replace('.', ',');
    s = s.replace(/0$/, '').replace(/,$/, '');
    return s + '%';
  };

  let activeCat = null; // highlight key or null

  const frame = document.getElementById('chartFrame');
  const legendCol = document.getElementById('legendCol');

  let tooltipEl = null;
  function ensureTooltip(){
    if (!tooltipEl){
      tooltipEl = document.createElement('div');
      tooltipEl.className = 'tooltip';
      frame.appendChild(tooltipEl);
    }
    return tooltipEl;
  }

  function showTooltip(targetEl, html){
    const tt = ensureTooltip();
    tt.innerHTML = html;
    tt.classList.add('show');
    positionTooltip(targetEl);
  }
  function hideTooltip(){
    if (tooltipEl) tooltipEl.classList.remove('show');
  }
  function positionTooltip(targetEl){
    const tt = ensureTooltip();
    const frameRect = frame.getBoundingClientRect();
    const tRect = targetEl.getBoundingClientRect();
    let x = tRect.left + tRect.width/2 - frameRect.left;
    let y = tRect.top - frameRect.top;

    tt.classList.remove('flip');
    tt.style.left = x + 'px';
    tt.style.top = y + 'px';

    // measure and clamp after paint
    requestAnimationFrame(()=>{
      const ttRect = tt.getBoundingClientRect();
      let shiftX = 0;
      if (ttRect.left < frameRect.left + 4){
        shiftX = (frameRect.left + 4) - ttRect.left;
      } else if (ttRect.right > frameRect.right - 4){
        shiftX = (frameRect.right - 4) - ttRect.right;
      }
      if (shiftX !== 0){
        tt.style.left = (x + shiftX) + 'px';
      }
      if (ttRect.top < frameRect.top + 4){
        tt.classList.add('flip');
        const bottomY = tRect.bottom - frameRect.top;
        tt.style.top = bottomY + 'px';
      }
    });
  }

  function svgNS(tag, attrs){
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function renderLegend(){
    legendCol.innerHTML = '<div class="legend-title">Термін початку моніторингу</div>';
    CAT_ORDER.forEach(key=>{
      const row = document.createElement('div');
      row.className = 'legend-row' + (activeCat && activeCat!==key ? ' dim' : '');
      row.dataset.cat = key;
      row.innerHTML = `
        <div class="legend-left">
          <span class="legend-dot" style="background:${CAT_COLOR[key]}"></span>
          <span class="legend-name">${CAT_NAME[key]}</span>
        </div>
      `;
      row.addEventListener('mouseenter', ()=>{ setActiveCat(key); });
      row.addEventListener('mouseleave', ()=>{ setActiveCat(null); });
      row.addEventListener('click', ()=>{ setActiveCat(activeCat===key ? null : key); });
      legendCol.appendChild(row);
    });
  }

  function setActiveCat(key){
    activeCat = key;
    document.querySelectorAll('.legend-row').forEach(r=>{
      r.classList.toggle('dim', !!activeCat && r.dataset.cat !== activeCat);
    });
    document.querySelectorAll('.bar').forEach(b=>{
      b.classList.toggle('dim', !!activeCat && b.dataset.cat !== activeCat);
    });
  }

  // ---------- 100%-stacked bar chart (equal-height columns) ----------
  function renderChart(){
    const W = 1000, H = 460;
    const padL = 40, padR = 40, padTop = 20, padBottom = 60;
    const plotW = W - padL - padR;
    const plotH = H - padTop - padBottom;

    const n = PERIOD_ORDER.length;
    const gap = plotW * 0.16;
    const barW = (plotW - gap*(n-1)) / n;

    const svg = svgNS('svg', {viewBox:`0 0 ${W} ${H}`, 'aria-label':'Розподіл термінів початку моніторингу за роками'});

    svg.appendChild(svgNS('line', {
      x1:padL, y1:H-padBottom, x2:W-padR, y2:H-padBottom,
      stroke:'#e5e1f0', 'stroke-width':2
    }));

    PERIOD_ORDER.forEach((p, i)=>{
      const period = DATA[p];
      const x = padL + i*(barW+gap);
      let yCursor = H - padBottom;

      CAT_ORDER.forEach(key=>{
        const c = period.cats.find(x=>x.key===key);
        const segH = (c.pct / 100) * plotH;
        const y = yCursor - segH;

        const rect = svgNS('rect', {
          x:x, y:y, width:barW, height:Math.max(segH,0), fill: CAT_COLOR[key], class:'bar'
        });
        rect.dataset.cat = key;
        const tipHtml = `<b>${nfInt.format(c.count)}</b> — ${fmtPct(c.pct)} від договорів ${period.label==='2024'||period.label==='2025' ? period.label+' року' : period.label} (усього ${nfInt.format(period.total)})<br>Термін: ${c.name}`;
        rect.addEventListener('mouseenter', ()=>{
          setActiveCat(key);
          showTooltip(rect, tipHtml);
        });
        rect.addEventListener('mouseleave', ()=>{ setActiveCat(null); hideTooltip(); });
        rect.addEventListener('click', ()=>{
          setActiveCat(activeCat===key ? null : key);
        });
        rect.addEventListener('touchstart', ()=>{
          showTooltip(rect, tipHtml);
          setActiveCat(key);
          setTimeout(()=>{ hideTooltip(); setActiveCat(null); }, 2000);
        }, {passive:true});

        svg.appendChild(rect);
        yCursor = y;
      });

      // period axis label
      const pLabel = svgNS('text', {
        x:x+barW/2, y: H-padBottom+34, class:'period-label', style:'font-size:21px'
      });
      pLabel.textContent = period.label;
      svg.appendChild(pLabel);
    });

    frame.innerHTML = '';
    frame.appendChild(svg);
    frame.appendChild(ensureTooltip());
  }

  renderChart();
  renderLegend();
})();
</script>

</body>
</html>
