<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зобов'язання щодо усунення порушень у моніторингах закупівель в оптимальному періоді</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#e45266;
    --purple:#18063a;
    --violet:#7237c0;
    --orange:#fcad10;
    --yellow:#fcd700;
    --green:#2db226;
    --gray:#505050;
    --tint:#f1eef7;
    --track:#ece7f5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Roboto',Arial,sans-serif;
    background:#ffffff;
    color:var(--purple);
  }
  .stage{
    container-type:inline-size;
    container-name:stage;
    width:100%;
    max-width:1920px;
    margin:0 auto;
    background:#ffffff;
  }
  .frame{
    width:100%;
    padding:3.2cqw 3.6cqw 2.6cqw;
  }

  /* ===== Desktop (default, wide container) ===== */
  .frame{
    aspect-ratio:16/9;
    display:flex;
    flex-direction:column;
  }

  .header{
    display:flex;
    flex-direction:column;
    gap:0.9cqw;
    margin-bottom:0;
  }
  .title{
    font-weight:900;
    font-size:2.55cqw;
    line-height:1.16;
    color:var(--purple);
    max-width:78%;
  }
  .subtitle{
    font-weight:400;
    font-size:1.15cqw;
    color:var(--gray);
    margin-bottom:0.9cqw;
  }
  .subtitle b{
    font-weight:700;
    color:var(--purple);
  }

  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .rows{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    min-height:0;
  }

  .row{
    display:grid;
    grid-template-columns:1.9cqw minmax(0,1fr) 11cqw;
    align-items:center;
    column-gap:1.1cqw;
    cursor:pointer;
    padding:0.32cqw 0;
    border-radius:0.6cqw;
    transition:background .15s ease;
  }
  .row:hover{ background:#faf6f9; }

  .rank{
    font-weight:700;
    font-size:1.05cqw;
    color:#b8afc6;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .row.active .rank{ color:var(--pink); }

  .rowmain{
    min-width:0;
  }
  .label{
    font-weight:500;
    font-size:1.12cqw;
    color:var(--purple);
    line-height:1.28;
    margin-bottom:0.42cqw;
  }
  .barwrap{
    position:relative;
    height:0.95cqw;
    background:var(--track);
    border-radius:999px;
    overflow:hidden;
  }
  .bar{
    position:absolute;
    left:0;top:0;bottom:0;
    width:0%;
    background:var(--pink);
    border-radius:999px;
    transition:width .5s cubic-bezier(.4,0,.2,1), opacity .2s ease;
  }
  .row.dim .bar{ opacity:.32; }
  .row.dim .label{ color:#9c93ab; }

  .valcol{
    text-align:right;
    line-height:1.2;
  }
  .valnum{
    font-weight:700;
    font-size:1.28cqw;
    color:var(--purple);
    font-variant-numeric:tabular-nums;
    display:block;
  }
  .row.dim .valnum{ color:#b8afc6; }
  .valpct{
    font-weight:400;
    font-size:0.98cqw;
    color:var(--gray);
    display:block;
    margin-top:0.1cqw;
  }
  .row.dim .valpct{ color:#b8afc6; }

  /* Tooltip */
  .tooltip{
    position:fixed;
    z-index:50;
    background:var(--purple);
    color:#fff;
    font-size:0.98cqw;
    font-weight:400;
    line-height:1.4;
    padding:0.7cqw 0.95cqw;
    border-radius:0.55cqw;
    max-width:min(320px,60cqw);
    width:max-content;
    pointer-events:none;
    opacity:0;
    transform:translate(-50%,-100%) translateY(-10px);
    transition:opacity .12s ease;
    box-shadow:0 8px 24px rgba(24,6,58,.22);
  }
  .tooltip.visible{ opacity:1; }
  .tooltip.flip{
    transform:translate(-50%,0) translateY(14px);
  }
  .tooltip::after{
    content:"";
    position:absolute;
    left:50%;
    top:100%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:var(--purple);
  }
  .tooltip.flip::after{
    top:auto;
    bottom:100%;
    border-top-color:transparent;
    border-bottom-color:var(--purple);
  }

  /* Footer */
  .footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1.2cqw;
    margin-top:1.2cqw;
    flex-wrap:wrap;
  }
  .source{
    font-size:0.92cqw;
    color:var(--gray);
    line-height:1.4;
    max-width:60%;
  }
  .source a{
    color:var(--gray);
    text-decoration:underline;
    text-decoration-color:#c9c2d4;
    transition:color .15s ease;
  }
  .source a:hover{ color:var(--pink); text-decoration-color:var(--pink); }

  .logos{
    display:flex;
    align-items:center;
    gap:1.4cqw;
    flex-wrap:wrap;
  }
  .logos img{ display:block; }
  .logo-ti{ height:1.9cqw; width:auto; }
  .logo-dozorro{ height:1.5cqw; width:auto; }

  /* ===== Mobile (narrow container) ===== */
  @container stage (max-width: 760px){
    .frame{
      aspect-ratio:auto;
      display:block;
      padding:6vw 5.5vw 5.5vw;
    }
    .header{
      gap:2.2vw;
      margin-bottom:5vw;
    }
    .title{
      font-size:6.6vw;
      max-width:100%;
    }
    .subtitle{ font-size:3.5vw; margin-bottom:3vw; }

    .main{ display:block; flex:none; }
    .rows{ display:flex; flex-direction:column; flex:none; justify-content:flex-start; gap:4.6vw; }

    .row{
      grid-template-columns:6vw minmax(0,1fr);
      grid-template-rows:auto auto;
      row-gap:1.6vw;
      column-gap:3vw;
      padding:0;
    }
    .rank{ font-size:3.4vw; align-self:start; padding-top:0.6vw; }
    .rowmain{ grid-column:2; grid-row:1; }
    .label{ font-size:3.9vw; margin-bottom:2vw; }
    .barwrap{ height:3.4vw; }
    .valcol{
      grid-column:2;
      grid-row:2;
      text-align:left;
      display:flex;
      align-items:baseline;
      gap:1.6vw;
    }
    .valnum{ font-size:4.6vw; }
    .valpct{ font-size:3.4vw; margin-top:0; }

    .tooltip{ font-size:3.4vw; padding:2.4vw 3vw; border-radius:2.4vw; max-width:min(280px,72vw); }
    .tooltip::after{ border-width:1.6vw; }

    .footer{
      margin-top:6vw;
      flex-direction:row;
      flex-wrap:wrap;
      align-items:center;
      gap:3vw;
    }
    .source{ font-size:3.1vw; max-width:100%; flex:1 1 100%; order:2; }
    .logos{ order:1; gap:4vw; }
    .logo-ti{ height:6vw; }
    .logo-dozorro{ height:4.8vw; }
  }
</style>
</head>

<div class="tooltip" id="tooltip"></div>

<script>
(function(){
  var TOTAL = 670;
  var DATA = [
    { label:"Відсутні зобов'язання, оскільки замовник усунув порушення під час моніторингу, зокрема відмінив закупівлю", value:215 },
    { label:"Відміна закупівлі", value:197 },
    { label:"Проведення роз'яснювальної роботи, економічних навчань, тощо", value:90 },
    { label:"Заходи щодо недопущення порушень у подальшому (без уточнень)", value:84 },
    { label:"Притягнення до дисциплінарної або матеріальної відповідальності осіб, які допустили порушення", value:67 },
    { label:"Скасування рішення про визначення переможця", value:37 },
    { label:"Оприлюднення документів (договір, звіт, обґрунтування технічних та якісних характеристик предмета закупівлі, зміни до тендерної документації та інше)", value:30 },
    { label:"Інші заходи (врахування вимог Рамкової угоди, приведення договірної ціни до вимог тендерної документації та інше, виготовлення кваліфікованого електронного підпису уповноваженій особі, усунути порушення при укладенні договору та інше)", value:26 },
    { label:"Відхилення тендерної пропозиції учасника", value:25 },
    { label:"Розірвання договору", value:21 }
  ];

  var numberFmt = new Intl.NumberFormat('uk-UA');
  var percentFmt = new Intl.NumberFormat('uk-UA', { minimumFractionDigits:2, maximumFractionDigits:2 });

  var maxVal = Math.max.apply(null, DATA.map(function(d){ return d.value; }));

  var rowsEl = document.getElementById('rows');
  var tooltip = document.getElementById('tooltip');
  var activeIdx = null;

  DATA.forEach(function(d, i){
    var pct = d.value / TOTAL * 100;
    var row = document.createElement('div');
    row.className = 'row';
    row.dataset.idx = i;

    var rank = document.createElement('div');
    rank.className = 'rank';
    rank.textContent = (i+1);

    var rowmain = document.createElement('div');
    rowmain.className = 'rowmain';

    var label = document.createElement('div');
    label.className = 'label';
    label.textContent = d.label;

    var barwrap = document.createElement('div');
    barwrap.className = 'barwrap';
    var bar = document.createElement('div');
    bar.className = 'bar';
    barwrap.appendChild(bar);

    rowmain.appendChild(label);
    rowmain.appendChild(barwrap);

    var valcol = document.createElement('div');
    valcol.className = 'valcol';
    var valnum = document.createElement('span');
    valnum.className = 'valnum';
    valnum.textContent = numberFmt.format(d.value);
    var valpct = document.createElement('span');
    valpct.className = 'valpct';
    valpct.textContent = percentFmt.format(pct) + '%';
    valcol.appendChild(valnum);
    valcol.appendChild(valpct);

    row.appendChild(rank);
    row.appendChild(rowmain);
    row.appendChild(valcol);
    rowsEl.appendChild(row);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        bar.style.width = (d.value / maxVal * 100) + '%';
      });
    });

    function handleEnter(evt){
      showTooltip(evt, d, pct);
    }
    function handleMove(evt){
      positionTooltip(evt);
    }
    function handleLeave(){
      if(touchedRecently) return;
      hideTooltip();
    }
    function handleClick(evt){
      toggleActive(i);
      showTooltip(evt, d, pct);
    }

    var touchedRecently = false;

    row.addEventListener('mouseenter', handleEnter);
    row.addEventListener('mousemove', handleMove);
    row.addEventListener('mouseleave', handleLeave);
    row.addEventListener('click', function(evt){
      if(touchedRecently) return;
      handleClick(evt);
    });
    row.addEventListener('touchstart', function(evt){
      touchedRecently = true;
      clearTimeout(row._touchFlagTimer);
      row._touchFlagTimer = setTimeout(function(){ touchedRecently = false; }, 600);

      toggleActive(i);
      showTooltip(evt.touches[0], d, pct);
      clearTimeout(row._hideTimer);
      row._hideTimer = setTimeout(hideTooltip, 2000);
    }, { passive:true });
  });

  function toggleActive(i){
    var rows = rowsEl.querySelectorAll('.row');
    if(activeIdx === i){
      activeIdx = null;
      rows.forEach(function(r){ r.classList.remove('active','dim'); });
      return;
    }
    activeIdx = i;
    rows.forEach(function(r){
      var idx = parseInt(r.dataset.idx,10);
      if(idx === i){ r.classList.add('active'); r.classList.remove('dim'); }
      else { r.classList.remove('active'); r.classList.add('dim'); }
    });
  }

  function showTooltip(evt, d, pct){
    tooltip.innerHTML = numberFmt.format(d.value) + ' — ' + percentFmt.format(pct) + '% від ' + numberFmt.format(TOTAL) + ' перевірених висновків моніторингу';
    tooltip.classList.add('visible');
    positionTooltip(evt);
  }

  function hideTooltip(){
    tooltip.classList.remove('visible');
  }

  function positionTooltip(evt){
    var x = evt.clientX;
    var y = evt.clientY;
    var margin = 8;
    var rowsRect = rowsEl.getBoundingClientRect();
    var topBound = rowsRect.top - margin;

    tooltip.classList.remove('flip');
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';

    var rect = tooltip.getBoundingClientRect();
    var vw = window.innerWidth;

    var newX = x;
    if(rect.left < margin){ newX = x + (margin - rect.left); }
    if(rect.right > vw - margin){ newX = x - (rect.right - (vw - margin)); }
    tooltip.style.left = newX + 'px';

    // Tooltip renders above the cursor by default (translateY -100%).
    // If that would push its top above the safe top bound, flip it below instead.
    if(rect.top < topBound){
      tooltip.classList.add('flip');
    }
  }

  document.addEventListener('click', function(evt){
    if(!evt.target.closest('.row')){
      activeIdx = null;
      rowsEl.querySelectorAll('.row').forEach(function(r){ r.classList.remove('active','dim'); });
    }
  });
})();
</script>
