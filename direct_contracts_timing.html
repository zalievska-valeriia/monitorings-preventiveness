<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Розподіл термінів початку моніторингу прямих договорів</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');

  :root{
    --pink:#e45266;
    --dark-purple:#18063a;
    --purple:#7237c0;
    --orange:#fcad10;
    --yellow:#fcd700;
    --grey:#505050;
    --tint:#f1eef8;
    --line:#e5e1f0;
    --bg:#ffffff;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Roboto',Arial,sans-serif;
    background:var(--bg);
    color:var(--dark-purple);
  }

  .stage{
    container-type: inline-size;
    container-name: stage;
    width:100%;
    max-width:1920px;
    margin:0 auto;
    background:#ffffff;
    padding: 3.2cqw 3.2cqw 2.4cqw;
  }

  .canvas{
    display:flex;
    flex-direction:column;
    width:100%;
    aspect-ratio: 16/9;
  }

  .head-row{
    margin-bottom: 1.8cqw;
  }

  h1{
    font-family:'Roboto',Arial,sans-serif;
    font-weight:900;
    font-size: 2.55cqw;
    line-height:1.12;
    margin:0;
    color:var(--dark-purple);
    max-width: 68cqw;
  }
  .subtitle{
    font-size: 1.05cqw;
    color:var(--grey);
    margin:.5cqw 0 0 0;
  }

  .legend-title-row{
    display:flex;
    justify-content:center;
    margin-bottom: .6cqw;
  }
  .legend-title{
    font-size:.95cqw;
    color:var(--grey);
    font-weight:500;
  }

  .legend-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:.6cqw 2.0cqw;
    margin-bottom: 1.8cqw;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:.55cqw;
    cursor:pointer;
    padding:.35cqw .55cqw;
    border-radius:10px;
    transition:background .15s ease, opacity .15s ease;
  }
  .legend-item:hover{
    background:var(--tint);
  }
  .legend-item.dim{
    opacity:.38;
  }
  .legend-dot{
    width:.95cqw;
    height:.95cqw;
    min-width:10px;
    min-height:10px;
    border-radius:4px;
    flex-shrink:0;
  }
  .legend-name{
    font-size:1.02cqw;
    font-weight:700;
    color:var(--dark-purple);
    white-space:nowrap;
  }

  .main-row{
    display:flex;
    align-items:stretch;
    flex:1;
    min-height:0;
  }

  .chart-col{
    flex:1;
    min-width:0;
    container-type: inline-size;
    container-name: chartwrap;
    position:relative;
  }

  .chart-frame{
    position:relative;
    width:100%;
    height:100%;
  }
  .chart-frame svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }

  .bar{
    cursor:pointer;
    transition: opacity .15s ease;
  }
  .bar.dim{ opacity:.32; }

  .axis-label{
    font-family:'Roboto',Arial,sans-serif;
    font-weight:700;
    font-size:19px;
    fill:var(--dark-purple);
    text-anchor:middle;
  }
  .axis-sub{
    font-family:'Roboto',Arial,sans-serif;
    font-weight:500;
    font-size:15px;
    fill:var(--grey);
    text-anchor:middle;
  }

  .tooltip{
    position:absolute;
    background:var(--dark-purple);
    color:#fff;
    padding:.75cqw 1.0cqw;
    border-radius:.55cqw;
    font-size:.95cqw;
    line-height:1.45;
    max-width:min(280px,34%);
    pointer-events:none;
    opacity:0;
    transition:opacity .12s ease;
    z-index:20;
    box-shadow:0 6px 18px rgba(24,6,58,.25);
  }
  .tooltip.show{ opacity:1; }
  .tooltip b{ font-weight:700; }
  .tooltip::after{
    content:"";
    position:absolute;
    border:6px solid transparent;
  }
  .tooltip.arrow-top::after{
    top:100%; left:var(--arrow-x,50%); transform:translateX(-50%);
    border-top-color:var(--dark-purple);
  }
  .tooltip.arrow-bottom::after{
    bottom:100%; left:var(--arrow-x,50%); transform:translateX(-50%);
    border-bottom-color:var(--dark-purple);
  }

  .footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:1.2cqw;
    margin-top:1.8cqw;
  }
  .source{
    font-size:.82cqw;
    color:var(--grey);
    max-width:62%;
    line-height:1.4;
  }
  .source a{
    color:var(--grey);
    text-decoration:underline;
    transition:color .15s ease;
  }
  .source a:hover{
    color:var(--pink);
  }
  .logos{
    display:flex;
    align-items:center;
    gap:1.4cqw;
    flex-shrink:0;
  }
  .logos img{
    height:1.7cqw;
    min-height:16px;
    display:block;
  }

  /* ---------------- MOBILE ---------------- */
  @container stage (max-width: 760px){
    .stage{ padding: 6vw 5vw 5vw; }
    .canvas{ aspect-ratio: auto; }
    h1{ font-size: 6.4vw; max-width:100%; line-height:1.18; }
    .subtitle{ font-size:3.4vw; }
    .head-row{ margin-bottom:5vw; }

    .legend-title-row{ margin-bottom:2vw; }
    .legend-title{ font-size:3.4vw; }
    .legend-row{ gap:2vw 4vw; margin-bottom:6vw; }
    .legend-dot{ width:3.4vw; height:3.4vw; min-width:12px; min-height:12px; }
    .legend-name{ font-size:3.5vw; }

    .main-row{ min-height: 90vw; }
    .chart-col{ width:100%; }

    .footer{ flex-direction:column; align-items:flex-start; margin-top:6vw; gap:3vw; }
    .source{ font-size:3vw; max-width:100%; }
    .logos img{ height:6vw; min-height:20px; }
    .tooltip{ font-size:3.2vw; padding:2.2vw 3vw; max-width:min(220px,72%); }
  }

  @container chartwrap (max-width: 420px){
    .axis-label{ font-size:34px !important; }
    .axis-sub{ font-size:26px !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="canvas">

    <div class="head-row">
      <h1>Розподіл термінів початку моніторингу прямих договорів після&nbsp;оприлюднення договору</h1>
      <div class="subtitle">частка від загальної кількості моніторингів прямих договорів за рік</div>
    </div>

      <div class="legend-title">Термін початку моніторингу</div>

    <div class="main-row">

<script>
(function(){
  const DATA = {
    "2024": { label:"2024", total:1569, cats:[
      {key:"0-7",   name:"0–7 днів",         count:73,   pct:4.65},
      {key:"8-14",  name:"8–14 днів",        count:178,  pct:11.34},
      {key:"15-21", name:"15–21 днів",       count:177,  pct:11.28},
      {key:"22+",   name:"22 і більше днів", count:1141, pct:72.72}
    ]},
    "2025": { label:"2025", total:1148, cats:[
      {key:"0-7",   name:"0–7 днів",         count:164, pct:14.29},
      {key:"8-14",  name:"8–14 днів",        count:264, pct:23.00},
      {key:"15-21", name:"15–21 днів",       count:183, pct:15.94},
      {key:"22+",   name:"22 і більше днів", count:537, pct:46.78}
    ]},
    "2026": { label:"I кв. 2026", total:279, cats:[
      {key:"0-7",   name:"0–7 днів",         count:38,  pct:13.62},
      {key:"8-14",  name:"8–14 днів",        count:75,  pct:26.88},
      {key:"15-21", name:"15–21 днів",       count:45,  pct:16.13},
      {key:"22+",   name:"22 і більше днів", count:121, pct:43.37}
    ]}
  };
  const PERIOD_ORDER = ["2024","2025","2026"];
  const CAT_ORDER = ["0-7","8-14","15-21","22+"];
  const CAT_COLOR = { "0-7":"#7237c0", "8-14":"#fcad10", "15-21":"#e45266", "22+":"#18063a" };
  const CAT_NAME  = { "0-7":"0–7 днів", "8-14":"8–14 днів", "15-21":"15–21 днів", "22+":"22 і більше днів" };

  const nfInt = new Intl.NumberFormat('uk-UA');
  const fmtPct = (v) => {
    let s = v.toFixed(2).replace('.', ',');
    return s;
  };

  const frame = document.getElementById('chartFrame');
  const legendRow = document.getElementById('legendRow');
  const tooltip = document.getElementById('tooltip');
  let activeCat = null;
  let svgEl = null;

  function svgNS(tag, attrs){
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for(const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function renderLegend(){
    legendRow.innerHTML = '';
    CAT_ORDER.forEach(key=>{
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.dataset.cat = key;
      item.innerHTML = `<span class="legend-dot" style="background:${CAT_COLOR[key]}"></span><span class="legend-name">${CAT_NAME[key]}</span>`;
      item.addEventListener('mouseenter', ()=>{ setActiveCat(key); });
      item.addEventListener('mouseleave', ()=>{ setActiveCat(null); });
      item.addEventListener('click', (e)=>{ e.stopPropagation(); setActiveCat(activeCat===key ? null : key); });
      legendRow.appendChild(item);
    });
  }

  function setActiveCat(key){
    activeCat = key;
    document.querySelectorAll('.legend-item').forEach(r=>{
      r.classList.toggle('dim', !!activeCat && r.dataset.cat !== activeCat);
    });
    document.querySelectorAll('.bar').forEach(b=>{
      b.classList.toggle('dim', !!activeCat && b.dataset.cat !== activeCat);
    });
  }

  function renderChart(){
    const W = 1000, H = 600;
    const padL = 20, padR = 20, padTop = 30, padBottom = 70;
    const plotW = W - padL - padR;
    const plotH = H - padTop - padBottom;

    const n = PERIOD_ORDER.length;
    const gap = plotW * 0.14;
    const barW = (plotW - gap*(n-1)) / n;

    const svg = svgNS('svg', {viewBox:`0 0 ${W} ${H}`, preserveAspectRatio:'xMidYMid meet', 'aria-label':'Розподіл термінів початку моніторингу прямих договорів'});

    svg.appendChild(svgNS('line', {
      x1:padL, y1:H-padBottom, x2:W-padR, y2:H-padBottom,
      stroke:'#e5e1f0', 'stroke-width':2
    }));

    PERIOD_ORDER.forEach((p, i)=>{
      const period = DATA[p];
      const x = padL + i*(barW+gap);
      let yCursor = H - padBottom;

      CAT_ORDER.forEach(key=>{
        const c = period.cats.find(x=>x.key===key);
        const segH = (c.pct/100) * plotH;
        const y = yCursor - segH;

        const rect = svgNS('rect', {
          x:x, y:y, width:barW, height:Math.max(segH,0), fill: CAT_COLOR[key], class:'bar'
        });
        rect.dataset.cat = key;

        const tipText = ()=> `<b>${nfInt.format(c.count)}</b> — ${fmtPct(c.pct)}% від моніторингів прямих договорів, розпочатих у ${period.label==='I кв. 2026' ? period.label : period.label+' році'}<br>Термін: ${c.name}`;

        rect.addEventListener('mouseenter', ()=>{ setActiveCat(key); showTooltip(rect, tipText()); });
        rect.addEventListener('mousemove', (e)=>{ positionTooltip(rect); });
        rect.addEventListener('mouseleave', ()=>{ setActiveCat(null); hideTooltip(); });
        rect.addEventListener('click', (e)=>{
          e.stopPropagation();
          setActiveCat(activeCat===key ? null : key);
        });
        rect.addEventListener('touchstart', ()=>{
          showTooltip(rect, tipText());
          setActiveCat(key);
          clearTimeout(window.__ttTimer);
          window.__ttTimer = setTimeout(()=>{ hideTooltip(); setActiveCat(null); }, 2000);
        }, {passive:true});

        svg.appendChild(rect);
        yCursor = y;
      });

      const axisY = H - padBottom + 34;
      const l1 = svgNS('text', {x:x+barW/2, y:axisY, class:'axis-label'});
      l1.textContent = period.label;
      svg.appendChild(l1);

      const l2 = svgNS('text', {x:x+barW/2, y:axisY+24, class:'axis-sub'});
      l2.textContent = nfInt.format(period.total) + ' моніторингів';
      svg.appendChild(l2);
    });

    frame.innerHTML = '';
    frame.appendChild(svg);
    frame.appendChild(tooltip);
    svgEl = svg;
  }

  function showTooltip(target, html){
    tooltip.innerHTML = html;
    tooltip.classList.add('show');
    positionTooltip(target);
  }
  function hideTooltip(){
    tooltip.classList.remove('show');
  }
  function positionTooltip(target){
    const wrapRect = frame.getBoundingClientRect();
    const tRect = target.getBoundingClientRect();

    tooltip.classList.remove('arrow-top','arrow-bottom');
    tooltip.style.left = '0px';
    tooltip.style.top = '0px';
    const ttRect = tooltip.getBoundingClientRect();

    let top = tRect.top - wrapRect.top - ttRect.height - 12;
    let arrowClass = 'arrow-top';
    if(top < 0){
      top = tRect.bottom - wrapRect.top + 12;
      arrowClass = 'arrow-bottom';
    }

    let left = tRect.left - wrapRect.left + tRect.width/2 - ttRect.width/2;
    const maxLeft = wrapRect.width - ttRect.width - 4;
    let arrowX = '50%';
    if(left < 4){
      arrowX = (tRect.left - wrapRect.left + tRect.width/2 - 4) + 'px';
      left = 4;
    } else if(left > maxLeft){
      const clamped = Math.max(4, maxLeft);
      arrowX = (tRect.left - wrapRect.left + tRect.width/2 - clamped) + 'px';
      left = clamped;
    }

    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    tooltip.classList.add(arrowClass);
    tooltip.style.setProperty('--arrow-x', arrowX);
  }

  document.addEventListener('click', ()=>{ setActiveCat(null); });

  renderLegend();
  renderChart();
})();
</script>
