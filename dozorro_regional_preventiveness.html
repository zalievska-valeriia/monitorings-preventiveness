<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Превентивність моніторингів за регіонами</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#e45266;
    --pink-soft:#f0879a;
    --purple:#18063a;
    --violet:#7237c0;
    --gray:#505050;
    --tint:#f1edf8;
    --tint2:#e3dbf2;
    --track:#ece5f6;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Roboto',sans-serif;
    background:#ffffff;
    color:var(--purple);
  }
  .wrap{
    width:100%;
    container-type: inline-size;
    container-name: wrap;
  }
  .stage{
    max-width:1240px;
    margin:0 auto;
    padding: 40px 48px 28px;
    container-type: inline-size;
    container-name: stage;
  }

  /* ---------- Header ---------- */
  .title{
    font-weight:900;
    font-size: clamp(22px, 3.4cqw, 34px);
    line-height:1.15;
    margin:0 0 22px;
    letter-spacing:-0.01em;
  }

  /* ---------- Filter row: sort dropdown + search ---------- */
  .filterbar{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap: 12px 16px;
    margin-bottom: 12px;
  }
  .sortgroup{
    display:flex;
    align-items:center;
    gap:10px;
    width:50%;
    min-width:220px;
    flex-shrink:0;
  }
  .filterlabel{
    font-size: clamp(12px, 1.15cqw, 14px);
    font-weight:500;
    color:var(--gray);
    margin: 0;
    white-space:nowrap;
  }
  .selectwrap{
    position:relative;
    flex:1;
    min-width:0;
  }
  .selectwrap::after{
    content:'';
    position:absolute;
    right:16px; top:50%;
    width:7px; height:7px;
    border-right:2px solid var(--purple);
    border-bottom:2px solid var(--purple);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }
  select#sortSelect{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    width:100%;
    font-family:inherit;
    font-size: clamp(12.5px, 1.2cqw, 14px);
    font-weight:500;
    color:var(--purple);
    background:var(--tint2);
    border:none;
    border-radius:999px;
    padding: 10px 38px 10px 18px;
    cursor:pointer;
    transition: background .18s ease;
  }
  select#sortSelect:hover{ background:#ddd0ef; }
  select#sortSelect:focus-visible{ outline:2px solid var(--purple); outline-offset:2px; }

  .searchwrap{
    position:relative;
    flex:1;
    min-width:160px;
  }
  .searchwrap::before{
    content:'';
    position:absolute;
    left:15px; top:50%;
    width:9px; height:9px;
    border:2px solid var(--gray);
    border-radius:50%;
    transform:translateY(-75%);
    pointer-events:none;
  }
  .searchwrap::after{
    content:'';
    position:absolute;
    left:22px; top:50%;
    width:6px; height:2px;
    background:var(--gray);
    transform:translateY(55%) rotate(45deg);
    pointer-events:none;
  }
  input#searchInput{
    width:100%;
    font-family:inherit;
    font-size: clamp(12.5px, 1.2cqw, 14px);
    font-weight:500;
    color:var(--purple);
    background:var(--tint);
    border:none;
    border-radius:999px;
    padding: 10px 16px 10px 34px;
    transition: background .18s ease;
  }
  input#searchInput::placeholder{ color:#ab9fc4; font-weight:400; }
  input#searchInput:hover{ background:#e9e2f5; }
  input#searchInput:focus-visible{ outline:2px solid var(--purple); outline-offset:2px; }

  .legend{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: clamp(11.5px, 1.05cqw, 13px);
    color:var(--gray);
    white-space:nowrap;
    margin-bottom: 18px;
  }
  .legend-dot{
    width:10px; height:10px;
    border-radius:50%;
    background:var(--pink);
    flex-shrink:0;
  }

  .empty-state{
    padding: 28px 4px;
    color:var(--gray);
    font-size: clamp(13px, 1.2cqw, 15px);
  }

  /* ---------- List ---------- */
  .list{
    display:flex;
    flex-direction:column;
  }
  .row{
    display:grid;
    grid-template-columns: clamp(28px,3cqw,38px) 1fr;
    column-gap: 14px;
    align-items:start;
    padding: 11px 0;
    border-bottom: 1px solid #f0ecf7;
  }
  .row:first-child{ padding-top:2px; }
  .row:last-child{ border-bottom:none; }

  .rank{
    font-weight:900;
    font-size: clamp(13px, 1.3cqw, 16px);
    color:#c9c0dd;
    padding-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .rowmain{ min-width:0; }
  .rowhead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }
  .name{
    font-weight:500;
    font-size: clamp(13px, 1.28cqw, 15.5px);
    line-height:1.32;
    color:var(--purple);
    max-width: 620px;
  }
  .name mark{
    background:transparent;
    color:var(--pink);
    font-weight:700;
  }
  .metrics{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .val{
    font-variant-numeric: tabular-nums;
    color:#b7aecb;
    font-weight:700;
    font-size: clamp(13px, 1.3cqw, 15.5px);
    transition: color .2s ease;
  }
  .val-total{ color:var(--purple); }
  .val-opt .pct{
    font-weight:500;
    font-size:0.86em;
    margin-left:6px;
    opacity:.75;
  }

  .list[data-mode="total"] .val-total{ color:var(--pink); }
  .list[data-mode="total"] .val-opt{ color:#b7aecb; font-weight:500; }
  .list[data-mode="optimal"] .val-opt{ color:var(--pink); font-weight:700; }
  .list[data-mode="optimal"] .val-total{ color:#b7aecb; font-weight:500; }
  .list[data-mode="share"] .val-opt{ color:var(--pink); font-weight:700; }
  .list[data-mode="share"] .val-total{ color:#b7aecb; font-weight:500; }

  .barwrap{ position:relative; cursor:pointer; }
  .bartrack{
    position:relative;
    width:100%;
    height: 10px;
    background:var(--track);
    border-radius:999px;
    overflow:hidden;
  }
  .barfill{
    position:relative;
    height:100%;
    background:#d9cdec;
    border-radius:999px;
    overflow:hidden;
    transition: width .5s cubic-bezier(.22,.9,.32,1);
  }
  .baropt{
    position:absolute;
    left:0; top:0; bottom:0;
    min-width:6px;
    background:var(--pink);
    border-radius:999px;
    transition: width .5s cubic-bezier(.22,.9,.32,1);
  }
  .row:hover .barfill{ background:#cabbe4; }
  .row.active .barfill{ background:#cabbe4; }

  /* ---------- Tooltip ---------- */
  .tooltip{
    position:fixed;
    z-index:50;
    background:var(--purple);
    color:#fff;
    font-size:13px;
    font-weight:500;
    line-height:1.4;
    padding:9px 13px;
    border-radius:10px;
    max-width:min(300px, 86vw);
    pointer-events:none;
    opacity:0;
    transform:translate(-50%,-8px) scale(.96);
    transition: opacity .15s ease, transform .15s ease;
  }
  .tooltip:after{
    content:"";
    position:absolute;
    left:50%; top:100%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:var(--purple);
  }
  .tooltip.show{ opacity:1; transform:translate(-50%,-12px) scale(1); }
  .tooltip.flip{ transform:translate(-50%,8px) scale(.96); }
  .tooltip.flip.show{ transform:translate(-50%,12px) scale(1); }
  .tooltip.flip:after{
    top:auto; bottom:100%;
    border-top-color:transparent; border-bottom-color:var(--purple);
  }
  .tt-num{ font-weight:900; }

  /* ---------- Footer ---------- */
  .footer{
    margin-top: 30px;
    padding-top: 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .footer-src{
    font-size: clamp(11.5px, 1.05cqw, 13px);
    color:var(--gray);
    line-height:1.4;
    max-width:640px;
  }
  .footer-src a{ color:inherit; text-decoration:none; font-weight:700; }
  .footer-src a:hover{ color:var(--pink); text-decoration:underline; }
  .logos{
    display:flex;
    align-items:center;
    gap:22px;
    flex-shrink:0;
  }
  .logos img{ display:block; height: clamp(20px, 2.2cqw, 26px); width:auto; }

  /* ---------- Mobile ---------- */
  @container stage (max-width: 760px){
    .stage{ padding: 26px 20px 22px; }
    .title{ font-size: clamp(19px, 5.2cqw, 24px); margin-bottom:16px; }
    .filterbar{ margin-bottom:12px; gap:10px; flex-direction:column; align-items:flex-start; }
    .sortgroup{ width:100%; min-width:0; }
    .selectwrap{ width:auto; }
    select#sortSelect{ width:100%; font-size:12.5px; padding:9px 34px 9px 15px; }
    .searchwrap{ width:100%; min-width:0; }
    input#searchInput{ font-size:12.5px; padding:9px 15px 9px 32px; }
    .legend{ font-size:11.5px; margin-bottom:14px; }
    .row{ grid-template-columns: 22px 1fr; column-gap:8px; padding:9px 0; }
    .rank{ font-size:12px; padding-top:1px; }
    .name{ font-size:12.5px; max-width:100%; }
    .val{ font-size:12.5px; }
    .rowhead{ margin-bottom:5px; gap:8px; }
    .bartrack{ height:8px; }
    .footer{ margin-top:22px; padding-top:14px; flex-direction:column; align-items:flex-start; }
    .logos{ width:100%; justify-content:space-between; gap:14px; }
    .logos img{ height:19px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">

    <h1 class="title">Превентивність моніторингів за регіонами</h1>

    <div class="filterbar">
      <div class="sortgroup">
        <label class="filterlabel" for="sortSelect">Сортувати за:</label>
        <div class="selectwrap">
          <select id="sortSelect">
            <option value="total">Кількістю моніторингів</option>
            <option value="optimal">Кількістю в оптимальний період</option>
            <option value="share">Часткою в оптимальний період</option>
          </select>
        </div>
      </div>
      <div class="searchwrap">
        <input type="text" id="searchInput" placeholder="Пошук офісу…" autocomplete="off">
      </div>
    </div>

    <div class="legend">
      <span class="legend-dot"></span>
      <span>Ініційовано в оптимальний період</span>
    </div>

    <div class="list" id="list" data-mode="total"></div>

    <div class="footer">
      <div class="footer-src">Дані про моніторинги, проведені у 2024, 2025 і першому кварталі 2026, з <a href="https://bi.prozorro.org/hub/" target="_blank" rel="noopener noreferrer">BI Prozorro</a>.</div>
      <div class="logos">
        <img id="logoTi" alt="Transparency International Ukraine" />
        <img id="logoDz" alt="DOZORRO" />
      </div>
    </div>

  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const DATA = [
  {name:"Державна аудиторська служба України", total:2375, opt:149},
  {name:"Північний офіс Держаудитслужби", total:1735, opt:63},
  {name:"Північно-східний офіс Держаудитслужби", total:1306, opt:52},
  {name:"Східний офіс Держаудитслужби", total:1317, opt:26},
  {name:"Західний офіс Держаудитслужби", total:1216, opt:27},
  {name:"Південний офіс Держаудитслужби", total:1179, opt:67},
  {name:"Управління західного офісу Держаудитслужби в Івано-Франківській області", total:979, opt:110},
  {name:"Управління північно-східного офісу Держаудитслужби в Полтавській області", total:896, opt:33},
  {name:"Управління східного офісу Держаудитслужби в Запорізькій області", total:816, opt:73},
  {name:"Управління північного офісу Держаудитслужби в Чернігівській області", total:818, opt:30},
  {name:"Управління західного офісу Держаудитслужби в Хмельницькій області", total:789, opt:37},
  {name:"Управління північного офісу Держаудитслужби в Житомирській області", total:747, opt:42},
  {name:"Управління південного офісу Держаудитслужби в Миколаївській області", total:726, opt:29},
  {name:"Управління північного офісу Держаудитслужби в Черкаській області", total:667, opt:44},
  {name:"Управління західного офісу Держаудитслужби в Рівненській області", total:687, opt:39},
  {name:"Управління західного офісу Держаудитслужби в Тернопільській області", total:598, opt:17},
  {name:"Управління західного офісу Держаудитслужби в Закарпатській області", total:541, opt:46},
  {name:"Управління західного офісу Держаудитслужби у Волинській області", total:512, opt:4},
  {name:"Управління східного офісу Держаудитслужби в Кіровоградській області", total:527, opt:26},
  {name:"Управління північного офісу Держаудитслужби у Вінницькій області", total:470, opt:34},
  {name:"Управління західного офісу Держаудитслужби в Чернівецькій області", total:429, opt:24},
  {name:"Управління північно-східного офісу Держаудитслужби в Луганській області", total:453, opt:6},
  {name:"Управління південного офісу Держаудитслужби в Херсонській області", total:424, opt:9},
  {name:"Управління північно-східного офісу Держаудитслужби в Сумській області", total:439, opt:13},
  {name:"Управління східного офісу Держаудитслужби в Донецькій області", total:295, opt:18},
];

DATA.forEach(d => { d.share = d.opt / d.total * 100; });
const MAX_TOTAL = Math.max(...DATA.map(d => d.total));

function fmtInt(n){ return n.toLocaleString('uk-UA'); }
function fmtPct(n){ return n.toLocaleString('uk-UA', {maximumFractionDigits:2, minimumFractionDigits:2}) + '%'; }

let currentMode = 'total';
let searchQuery = '';

const listEl = document.getElementById('list');
const tooltip = document.getElementById('tooltip');
const searchInput = document.getElementById('searchInput');

function rankedData(){
  const arr = [...DATA];
  if(currentMode === 'total') arr.sort((a,b) => b.total - a.total);
  else if(currentMode === 'optimal') arr.sort((a,b) => b.opt - a.opt);
  else arr.sort((a,b) => b.share - a.share);
  arr.forEach((d, i) => { d._rank = i + 1; });
  return arr;
}

function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlightName(name, q){
  if(!q) return name;
  const re = new RegExp('(' + escapeRe(q) + ')', 'ig');
  return name.replace(re, '<mark>$1</mark>');
}

function render(){
  listEl.setAttribute('data-mode', currentMode);
  const ranked = rankedData();
  const q = searchQuery.trim().toLowerCase();
  const arr = q ? ranked.filter(d => d.name.toLowerCase().includes(q)) : ranked;

  listEl.innerHTML = '';

  if(arr.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'Нічого не знайдено — спробуйте інший запит.';
    listEl.appendChild(empty);
    return;
  }

  arr.forEach((d) => {
    const totalW = (d.total / MAX_TOTAL) * 100;
    const optW = (d.opt / d.total) * 100;

    const row = document.createElement('div');
    row.className = 'row';

    row.innerHTML = `
      <div class="rank">${String(d._rank).padStart(2,'0')}</div>
      <div class="rowmain">
        <div class="rowhead">
          <span class="name">${highlightName(d.name, q)}</span>
          <span class="metrics">
            <span class="val val-total">${fmtInt(d.total)}</span>
            <span class="val val-opt">${fmtInt(d.opt)}<span class="pct">(${fmtPct(Math.round(d.share*100)/100)})</span></span>
          </span>
        </div>
        <div class="barwrap">
          <div class="bartrack">
            <div class="barfill" style="width:${totalW}%">
              <div class="baropt" style="width:${optW}%"></div>
            </div>
          </div>
        </div>
      </div>
    `;

    const barwrap = row.querySelector('.barwrap');
    barwrap.addEventListener('mouseenter', (e) => showTooltip(e, d, row));
    barwrap.addEventListener('mousemove', (e) => positionTooltip(e));
    barwrap.addEventListener('mouseleave', () => hideTooltip(row));
    barwrap.addEventListener('click', (e) => {
      const isActive = row.classList.contains('active');
      document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
      if(!isActive){
        row.classList.add('active');
        showTooltip(e, d, row);
        setTimeout(() => hideTooltip(row), 2200);
      } else {
        hideTooltip(row);
      }
    });

    listEl.appendChild(row);
  });
}

let hideTimer = null;

function tooltipText(d){
  const pct = fmtPct(Math.round(d.share*100)/100);
  return `<span class="tt-num">${fmtInt(d.opt)}</span> — ${pct} моніторингів цього офісу ініційовано в оптимальний період (з ${fmtInt(d.total)} загалом)`;
}

function showTooltip(evt, d, row){
  clearTimeout(hideTimer);
  tooltip.innerHTML = tooltipText(d);
  tooltip.classList.add('show');
  positionTooltip(evt);
}

function hideTooltip(row){
  tooltip.classList.remove('show');
}

function positionTooltip(evt){
  const pad = 10;
  tooltip.classList.remove('flip');
  tooltip.style.left = evt.clientX + 'px';
  tooltip.style.top = evt.clientY + 'px';

  requestAnimationFrame(() => {
    const r = tooltip.getBoundingClientRect();
    let x = evt.clientX;
    let y = evt.clientY;

    if(r.left < pad){ x += (pad - r.left); }
    if(r.right > window.innerWidth - pad){ x -= (r.right - (window.innerWidth - pad)); }

    if(r.top < pad){
      tooltip.classList.add('flip');
    }

    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  });
}

document.getElementById('sortSelect').addEventListener('change', (e) => {
  currentMode = e.target.value;
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  hideTooltip();
  render();
});

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  hideTooltip();
