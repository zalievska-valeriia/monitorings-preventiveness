<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOZORRO — Розподіл моніторингів за часовими періодами початку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#e45266;
    --purple-dark:#18063a;
    --violet:#7237c0;
    --green:#2db226;
    --orange:#fcad10;
    --yellow:#fcd700;
    --gray:#505050;
    --tint:#efeaf7;
    --tint-strong:#e2d9f3;
    --line:#e6e1f0;
    --bg:#f4f2f9;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Roboto', Arial, sans-serif;
    background: var(--bg);
    color: var(--purple-dark);
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    width:100%;
    display:flex;
    justify-content:center;
    padding: 18px;
  }
  .stage{
    container-type: inline-size;
    container-name: stage;
    width:100%;
    max-width:1920px;
    background:#ffffff;
    border-radius: 1.2cqw;
    padding: 3.4cqw 3.8cqw 2.6cqw;
    position:relative;
    display:flex;
    flex-direction:column;
    aspect-ratio: 16/9;
  }

  /* ---------- CONTENT WRAPPER ---------- */
  .content{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
  }

  /* ---------- HEADER ---------- */
  .head{
    display:flex;
    align-items:flex-start;
    flex-shrink:0;
  }
  .title{
    margin:0;
    white-space:nowrap;
    font-weight:900;
    font-size: clamp(20px, 2.55cqw, 44px);
    line-height:1.14;
    color: var(--purple-dark);
    letter-spacing:-0.01em;
  }
  .subtitle{
    margin-top: .6cqw;
    font-weight:400;
    font-size: clamp(12.5px, 1.05cqw, 18px);
    color: var(--gray);
  }

  /* ---------- TOP ROW: legend (left) + total (right) ---------- */
  .toprow{
    margin-top: 2.6cqw;
    flex-shrink:0;
    display:flex;
    align-items:center;
    padding-bottom: 1.6cqw;
    border-bottom: 1px solid var(--line);
  }
  .legendbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap: .6cqw 2.2cqw;
  }
  .legenditem{
    display:flex;
    align-items:center;
    gap: .6cqw;
    cursor:pointer;
    padding: .3cqw 0;
    transition: opacity .18s ease;
  }
  .legenddot{
    width: .8cqw;
    height:.8cqw;
    min-width:9px;
    min-height:9px;
    border-radius:3px;
    flex-shrink:0;
  }
  .legendname{
    font-weight:500;
    font-size: clamp(12.5px, 1.05cqw, 17px);
    color: var(--purple-dark);
    white-space:nowrap;
  }

  /* ---------- VERTICAL BAR CHART ---------- */
  .chartstage{
    flex:1 1 auto;
    min-height:0;
    margin-top: 2cqw;
    display:flex;
    align-items:flex-end;
    justify-content: space-evenly;
    gap: 3cqw;
  }
  .barcol{
    height:100%;
    flex: 0 1 18cqw;
    max-width:18cqw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
  }
  .barvalue{
    font-weight:700;
    font-size: clamp(13px, 1.15cqw, 19px);
    color: var(--purple-dark);
    margin-bottom: .7cqw;
    white-space:nowrap;
  }
  .barstack{
    width:100%;
    max-width: 9.5cqw;
    display:flex;
    flex-direction:column-reverse;
    border-radius: .9cqw .9cqw 0 0;
    overflow:hidden;
    background: var(--tint);
  }
  .barseg{
    width:100%;
    cursor:pointer;
    transition: opacity .18s ease;
  }
  .baryear{
    margin-top: 1cqw;
    font-weight:700;
    font-size: clamp(13px, 1.15cqw, 19px);
    color: var(--purple-dark);
    white-space:nowrap;
    text-align:center;
  }

  /* ---------- FOOTER ---------- */
  .footer{
    margin-top: 2cqw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 1.4cqw;
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .source{
    font-size: clamp(10.5px, .8cqw, 14px);
    color: var(--gray);
    line-height:1.4;
  }
  .source a{
    color: var(--gray);
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .source a:hover{ color: var(--pink); }
  .logos{
    display:flex;
    align-items:center;
    gap: 2.2cqw;
    flex-shrink:0;
  }
  .logo{ display:block; height:auto; }
  .logo-ti{ width: 9.2cqw; min-width:70px; }
  .logo-dz{ width: 8.4cqw; min-width:64px; }

  /* ---------- TOOLTIP ---------- */
  .tooltip{
    position:absolute;
    z-index:20;
    background: var(--purple-dark);
    color:#fff;
    font-size: clamp(11.5px, .82cqw, 14px);
    line-height:1.4;
    padding: .7cqw .9cqw;
    border-radius: .55cqw;
    max-width: min(320px, 42%);
    pointer-events:none;
    opacity:0;
    transform: translate(-50%, calc(-100% - 10px));
    transition: opacity .12s ease;
    box-shadow: 0 8px 24px rgba(24,6,58,.25);
  }
  .tooltip.show{ opacity:1; }
  .tooltip::after{
    content:"";
    position:absolute;
    left:50%;
    top:100%;
    transform:translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--purple-dark);
  }
  .tooltip.flip{
    transform: translate(-50%, 10px);
  }
  .tooltip.flip::after{
    top:auto;
    bottom:100%;
    border-top-color:transparent;
    border-bottom-color: var(--purple-dark);
  }

  /* ---------- MOBILE ---------- */
  @container stage (max-width: 760px){
    .stage{
      aspect-ratio: unset;
      border-radius: 4vw;
      padding: 6vw 5.5vw 5vw;
    }
    .title{ font-size: clamp(19px, 6.6cqw, 30px); white-space:normal; }
    .subtitle{ font-size: clamp(12px, 3.4vw, 15px); margin-top:2vw;}
    .toprow{
      margin-top:6vw;
      flex-direction:column;
      align-items:flex-start;
      gap: 4vw;
      padding-bottom:4vw;
    }
    .legendbar{ gap: 2.5vw 5vw; }
    .legenditem{ gap: 1.6vw; max-width:100%; }
    .legenddot{ width:2.6vw; height:2.6vw; min-width:9px; min-height:9px; }
    .legendname{ font-size: clamp(12.5px, 3.6vw, 15px); white-space:normal; }
    .chartstage{
      height: 66vw;
      flex:0 0 auto;
      margin-top:7vw;
      gap: 4vw;
    }
    .barcol{ flex-basis:24vw; max-width:28vw; }
    .barvalue{ font-size: clamp(11.5px, 3.3vw, 14px); margin-bottom:1.6vw; }
    .barstack{ max-width:16vw; border-radius:2.4vw 2.4vw 0 0; }
    .baryear{ font-size: clamp(11.5px, 3.3vw, 14px); margin-top:2vw; }
    .footer{ margin-top:6vw; gap:3vw; }
    .source{ font-size: clamp(10.5px, 3vw, 12.5px); flex:1 1 220px; }
    .logos{ gap:5vw; }
    .logo-ti{ width:22vw; }
    .logo-dz{ width:20vw; }
    .tooltip{ max-width:min(260px,70%); font-size: clamp(11px,3.2vw,13px); }
  }
</style>
</head>

    <div class="tooltip" id="tooltip"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var CATS = [
    { key:"before",  name:"До визначення переможця",                                   color:"#e45266" },
    { key:"between", name:"Між визначенням переможця і оприлюдненням договору",         color:"#7237c0" },
    { key:"after",   name:"Після оприлюднення договору",                                color:"#18063a" }
  ];

  var YEAR_ORDER = ["2024","2025","q12026"];

  var DATA = {
    "2024":   { label:"2024",           values:[419,971,7587]  },
    "2025":   { label:"2025",           values:[755,2329,6703] },
    "q12026": { label:"I квартал 2026", values:[157,571,1448]  },
    "all":    { label:"Загалом",        values:[1331,3871,15738] }
  };

  Object.keys(DATA).forEach(function(k){
    DATA[k].total = DATA[k].values.reduce(function(a,b){return a+b;},0);
  });

  var fmtInt = function(n){ return Math.round(n).toLocaleString('uk-UA'); };
  var fmtPct = function(p){
    var r = Math.round(p*100)/100;
    if (Math.abs(r - Math.round(r)) < 0.005) return Math.round(r) + '%';
    var s = r.toFixed(2);
    if (s.endsWith('0')) s = s.slice(0,-1);
    return s.replace('.', ',') + '%';
  };

  var stage       = document.getElementById('stage');
  var chartStage  = document.getElementById('chartStage');
  var legendBar   = document.getElementById('legendBar');
  var tooltip     = document.getElementById('tooltip');

  var activeIndex = -1;

  function buildChart(){
    chartStage.innerHTML = '';
    YEAR_ORDER.forEach(function(yk){
      var d = DATA[yk];
      var col = document.createElement('div');
      col.className = 'barcol';

      var valueEl = document.createElement('div');
      valueEl.className = 'barvalue';
      valueEl.textContent = fmtInt(d.total);

      var stack = document.createElement('div');
      stack.className = 'barstack';
      stack.style.height = '100%';

      d.values.forEach(function(v, i){
        var frac = d.total ? (v / d.total * 100) : 0;
        var seg = document.createElement('div');
        seg.className = 'barseg';
        seg.style.height = frac + '%';
        seg.style.background = CATS[i].color;
        seg.setAttribute('data-index', i);
        seg.addEventListener('mouseenter', function(e){ showTooltip(e, i, yk); });
        seg.addEventListener('mousemove', function(e){ moveTooltip(e); });
        seg.addEventListener('mouseleave', hideTooltip);
        seg.addEventListener('click', function(){ toggleIndex(i); });
        stack.appendChild(seg);
      });

      var yearEl = document.createElement('div');
      yearEl.className = 'baryear';
      yearEl.textContent = d.label;

      col.appendChild(valueEl);
      col.appendChild(stack);
      col.appendChild(yearEl);
      chartStage.appendChild(col);
    });
  }

  function buildLegend(){
    legendBar.innerHTML = '';
    CATS.forEach(function(cat, i){
      var item = document.createElement('div');
      item.className = 'legenditem';
      item.setAttribute('data-index', i);

      var dot = document.createElement('span');
      dot.className = 'legenddot';
      dot.style.background = cat.color;

      var nameEl = document.createElement('span');
      nameEl.className = 'legendname';
      nameEl.textContent = cat.name;

      item.appendChild(dot);
      item.appendChild(nameEl);

      item.addEventListener('mouseenter', function(){ applyHighlight(i); });
      item.addEventListener('mouseleave', function(){ applyHighlight(); });
      item.addEventListener('click', function(){ toggleIndex(i); });

      legendBar.appendChild(item);
    });
  }

  function toggleIndex(i){
    activeIndex = (activeIndex === i) ? -1 : i;
    applyHighlight();
  }

  function applyHighlight(hoverIdx){
    var idx = (hoverIdx === undefined) ? activeIndex : hoverIdx;
    var segs = chartStage.querySelectorAll('.barseg');
    segs.forEach(function(s){
      var i = +s.getAttribute('data-index');
      s.style.opacity = (idx === -1 || i === idx) ? 1 : .28;
    });
    var items = legendBar.querySelectorAll('.legenditem');
    items.forEach(function(it){
      var i = +it.getAttribute('data-index');
      it.style.opacity = (idx === -1 || i === idx) ? 1 : .45;
    });
  }

  function showTooltip(e, i, yearKey){
    var d = DATA[yearKey];
    var v = d.values[i];
    var pct = d.total ? (v / d.total * 100) : 0;
    tooltip.innerHTML = '<b>' + CATS[i].name + '</b><br>' + fmtInt(v) + ' — ' + fmtPct(pct) + ' від моніторингів ' + d.label;
    tooltip.classList.add('show');
    positionTooltip(e);
  }
  function moveTooltip(e){ positionTooltip(e); }
  function hideTooltip(){ tooltip.classList.remove('show'); }

  function positionTooltip(e){
    var stageRect = stage.getBoundingClientRect();
    var x = e.clientX - stageRect.left;
    var y = e.clientY - stageRect.top;

    tooltip.classList.remove('flip');
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';

    var tRect = tooltip.getBoundingClientRect();
    var pad = 8;

    var overflowRight = (tRect.right) - (stageRect.right - pad);
    var overflowLeft = (stageRect.left + pad) - (tRect.left);
    var dx = 0;
    if (overflowRight > 0) dx = -overflowRight;
    if (overflowLeft > 0) dx = overflowLeft;
    if (dx !== 0) tooltip.style.left = (x + dx) + 'px';

    if (y - tRect.height - 16 < 0){
      tooltip.classList.add('flip');
    }
  }

  function render(){
    buildLegend();
    buildChart();
    activeIndex = -1;
    applyHighlight();
  }

  // mobile tap-to-show tooltip with auto-hide
  var isTouch = window.matchMedia('(hover: none)').matches;
  if (isTouch){
    var hideTimer = null;
    stage.addEventListener('touchstart', function(e){
      var target = e.target.closest('.barseg');
      if (!target) return;
      var i = +target.getAttribute('data-index');
      var col = target.closest('.barcol');
      var yearKey = YEAR_ORDER[Array.prototype.indexOf.call(chartStage.children, col)];
      var touch = e.touches[0];
      showTooltip({clientX:touch.clientX, clientY:touch.clientY}, i, yearKey);
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(hideTooltip, 2000);
    }, {passive:true});
  }

  render();
})();
</script>
